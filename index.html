<script type="module">
  // Importação das ferramentas do Firebase e do Firestore (versão 10.13.0)
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // Sua configuração web do Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyAL2xXqo83pWKhyCta4Nk0gockDstxtJY4",
    authDomain: "agendamento-alpale.firebaseapp.com",
    projectId: "agendamento-alpale",
    storageBucket: "agendamento-alpale.firebasestorage.app",
    messagingSenderId: "491340347533",
    appId: "1:491340347533:web:0983b4dba5bbdcc534cac4"
  };

  // Inicializa o Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // --- DADOS BÁSICOS DO SISTEMA ---
  const EXAMS = ["CLINICO","AUDIO","EEG","ECG","ACV","ESP","ISHI","RX","LAB","PSICO","CINESIO","ODONTO","TOXIC","OTOLOGICO","VOCAL"];
  const TIPOS_SUGERIDOS = ["Admissional","Periódico","Demissional","Mudança de Função","Mudança de Risco","Retorno","Revalidação"];
  const WEEKDAY_LABELS = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  const MONTH_LABELS = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

  function pad2(n){ return String(n).padStart(2,"0"); }
  function roundToHalfHour(hhmm){
    const [h,m] = hhmm.split(":").map(Number);
    let totalMin = h*60 + m;
    totalMin = Math.round(totalMin/30)*30;
    totalMin = ((totalMin % 1440) + 1440) % 1440;
    return `${pad2(Math.floor(totalMin/60))}:${pad2(totalMin%60)}`;
  }

  // ---------- médico do plantão (escala clínica) ----------
  const SCHEDULE_BY_WEEKDAY = {
    1: [ { start:"06:30", end:"10:30", medico:"Dra. Gizelle" }, { start:"11:00", end:"13:00", medico:"Dr. Luiz" }, { start:"16:00", end:"17:00", medico:"Dra. Nadia" } ],
    2: [ { start:"06:30", end:"10:30", medico:"Dra. Gizelle" }, { start:"11:00", end:"13:00", medico:"Dra. Nadia" }, { start:"14:30", end:"16:00", medico:"Dr. Luiz" } ],
    3: [ { start:"06:30", end:"10:30", medico:"Dra. Gizelle" }, { start:"11:00", end:"13:00", medico:"Dr. Luiz" } ],
    4: [ { start:"06:30", end:"10:30", medico:"Dra. Louane" }, { start:"11:00", end:"13:00", medico:"Dra. Nadia" }, { start:"13:30", end:"17:00", medico:"Dra. Gizelle" } ],
    5: [ { start:"06:30", end:"10:30", medico:"Dra. Louane" }, { start:"11:00", end:"13:00", medico:"Dra. Nadia" }, { start:"13:30", end:"16:00", medico:"Dr. Guilherme" } ],
  };
  const WEEKDAY_FULL = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];

  function timeToMin(hhmm){ const [h,m] = hhmm.split(":").map(Number); return h*60+m; }
  function getMedicoForSlot(weekday, hhmm){
    const slots = SCHEDULE_BY_WEEKDAY[weekday];
    if(!slots || !hhmm) return null;
    const t = timeToMin(hhmm);
    const hit = slots.find(s => t >= timeToMin(s.start) && t < timeToMin(s.end));
    return hit ? hit.medico : null;
  }
  function getMedicoForDate(dateISO, hhmm){
    if(!hhmm) return null;
    const weekday = new Date(dateISO+"T12:00:00").getDay();
    return getMedicoForSlot(weekday, hhmm);
  }
  function todayISO(){
    const d = new Date();
    const off = d.getTimezoneOffset();
    return new Date(d.getTime() - off*60000).toISOString().slice(0,10);
  }
  function fmtWeekday(iso){
    const d = new Date(iso+"T12:00:00");
    const s = d.toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"});
    return s.charAt(0).toUpperCase()+s.slice(1);
  }
  function shiftDate(iso,delta){
    const d = new Date(iso+"T12:00:00"); d.setDate(d.getDate()+delta);
    return d.toISOString().slice(0,10);
  }
  function shiftMonth(ym,delta){
    const [y,m] = ym.split("-").map(Number);
    const d = new Date(y, m-1+delta, 1);
    return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
  }
  function monthMatrix(ym){
    const [y,m] = ym.split("-").map(Number);
    const first = new Date(y,m-1,1);
    const startOffset = first.getDay();
    const daysInMonth = new Date(y,m,0).getDate();
    const cells = [];
    for(let i=0;i<startOffset;i++) cells.push(null);
    for(let d=1;d<=daysInMonth;d++) cells.push(`${y}-${pad2(m)}-${pad2(d)}`);
    while(cells.length%7!==0) cells.push(null);
    return cells;
  }
  function miniMonthMatrix(year, monthIndex0){
    const first = new Date(year, monthIndex0, 1);
    const startOffset = first.getDay();
    const daysInMonth = new Date(year, monthIndex0+1, 0).getDate();
    const cells = [];
    for(let i=0;i<startOffset;i++) cells.push(null);
    for(let d=1;d<=daysInMonth;d++) cells.push(`${year}-${pad2(monthIndex0+1)}-${pad2(d)}`);
    return cells;
  }
  function emptyExams(){ const o={}; EXAMS.forEach(k=>o[k]=false); return o; }
  function emptyForm(){ return { horario:"", empresa:"", tipo:"", funcionario:"", exams: emptyExams() }; }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  // ---------- state ----------
  const state = {
    date: todayISO(),
    viewMode: "day",
    monthCursor: todayISO().slice(0,7),
    yearCursor: Number(todayISO().slice(0,4)),
    allEntries: [], 
    entries: [],    
    index: {},      
    form: emptyForm(),
    editingId: null,
    formError: "",
    confirmDeleteId: null,
    error: "",
    listening: false,
    aiThinking: false,
    micError: "",
    apiKey: localStorage.getItem("claude-api-key") || "",
    showAiPanel: false,
    apiKeyDraft: "",
    widgetOpen: false,
    chatMessages: [], 
    speechEnabled: true,
    pendingAppointment: null,
    awaitingConfirmation: false
  };

  function setState(patch){ Object.assign(state, patch); render(); }

  // --- ESCUTANDO O FIREBASE EM TEMPO REAL ---
  onSnapshot(collection(db, "agendamentos"), (snapshot) => {
    const all = [];
    const idx = {};
    snapshot.forEach(doc => {
      const data = doc.data();
      all.push(data);
      idx[data.date] = (idx[data.date] || 0) + 1;
    });
    state.allEntries = all;
    state.index = idx;
    state.entries = all.filter(e => e.date === state.date);
    render(); 
  });

  // ---------- actions ----------
  function goToDay(iso){ setState({ date: iso, viewMode:"day", entries: state.allEntries.filter(e=>e.date===iso), form: emptyForm(), editingId:null, formError:"" }); }
  function changeDate(iso){ setState({ date: iso, entries: state.allEntries.filter(e=>e.date===iso), form: emptyForm(), editingId:null, formError:"" }); }
  function openMonth(ym){ setState({ monthCursor: ym, viewMode: "month" }); }

  function toggleExam(k){ state.form.exams[k] = !state.form.exams[k]; render(); }

  async function submitForm(e){
    e.preventDefault();
    const f = state.form;
    if(!f.horario){ setState({formError:"Informe o horário do agendamento."}); return; }
    if(!f.empresa.trim() && !f.funcionario.trim()){ setState({formError:"Informe ao menos a empresa ou o funcionário."}); return; }
    
    const cleanExams = {};
    EXAMS.forEach(k=>{ if(f.exams[k]) cleanExams[k]=1; });
    const medico = cleanExams.CLINICO ? getMedicoForDate(state.date, f.horario) : null;
    
    const entryId = state.editingId || uid(); 
    const entryData = { id: entryId, date: state.date, ...f, exams: cleanExams, medico };

    try {
      await setDoc(doc(db, "agendamentos", entryId), entryData);
      setState({ form: emptyForm(), editingId:null, formError:"" });
    } catch (err) {
      setState({ formError: "Erro ao salvar na nuvem: " + err.message });
    }
  }

  function startEdit(entry){
    setState({
      form: { horario:entry.horario||"", empresa:entry.empresa||"", tipo:entry.tipo||"", funcionario:entry.funcionario||"",
               exams: {...emptyExams(), ...Object.fromEntries(EXAMS.map(k=>[k, !!entry.exams?.[k]]))} },
      editingId: entry.id, formError:""
    });
  }
  function cancelEdit(){ setState({ form: emptyForm(), editingId:null, formError:"" }); }

  async function deleteEntry(id){
    try {
      await deleteDoc(doc(db, "agendamentos", id));
      setState({ confirmDeleteId:null, ...(state.editingId===id?{form:emptyForm(),editingId:null}:{}) });
    } catch(err) {
      setState({ error: "Erro ao excluir da nuvem: " + err.message });
    }
  }

  // ---------- voice dictation ----------
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  const MIC_SUPPORTED = !!SpeechRecognitionCtor;
  let recognition = null;

  function stripAccents(s){ return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase(); }

  const EXAM_SYNONYMS = {
    CLINICO: ["clinico"], AUDIO: ["audio","audiometria"], EEG: ["eeg","eletroencefalograma"],
    ECG: ["ecg","eletrocardiograma"], ACV: ["acv","acuidade visual"], ESP: ["esp","espirometria"],
    ISHI: ["ishi","ishihara"], RX: ["rx","raio x","raio-x","raiox"], LAB: ["lab","laboratorial","laboratorio"],
    PSICO: ["psico","psicotecnico"], CINESIO: ["cinesio","cinesioteste","cinesiologico"],
    ODONTO: ["odonto","odontologico","dental"], TOXIC: ["toxic","toxicologico"], OTOLOGICO: ["otologico","otologia"],
    VOCAL: ["triagem vocal","vocal","fonoaudiologia"]
  };

  const TIME_WORDS = { "meio dia":"12:00", "meio-dia":"12:00", "meia noite":"00:00", "meia-noite":"00:00" };

  function extractHorario(norm){
    for(const [word,val] of Object.entries(TIME_WORDS)){
      if(norm.includes(word)) return roundToHalfHour(val);
    }
    const m = norm.match(/(\d{1,2})\s*(?:h|:|horas?)\s*(\d{1,2})?/);
    if(m){
      let hh = Math.min(23, parseInt(m[1],10));
      let mm = m[2] ? Math.min(59, parseInt(m[2],10)) : 0;
      return roundToHalfHour(`${pad2(hh)}:${pad2(mm)}`);
    }
    return null;
  }

  function extractMarkedSegment(norm, raw, markers){
    const allMarkers = ["horario","hora","empresa","funcionario","funcionaria","paciente","tipo","exame","exames"];
    for(const marker of markers){
      const idx = norm.indexOf(marker);
      if(idx===-1) continue;
      const afterStart = idx + marker.length;
      let end = raw.length;
      for(const other of allMarkers){
        if(other===marker) continue;
        const oIdx = norm.indexOf(other, afterStart);
        if(oIdx!==-1 && oIdx < end) end = oIdx;
      }
      const seg = raw.slice(afterStart, end).trim().replace(/^[:,-]\s*/,"");
      if(seg) return seg;
    }
    return null;
  }

  function parseVoiceCommand(rawText){
    const norm = stripAccents(rawText);
    const fields = [];
    const result = { horario:null, empresa:null, funcionario:null, tipo:null, exams:{} };

    const horario = extractHorario(norm);
    if(horario){ result.horario = horario; fields.push("horário "+horario); }

    const empresa = extractMarkedSegment(norm, rawText, ["empresa"]);
    if(empresa){ result.empresa = empresa; fields.push("empresa: "+empresa); }

    const funcionario = extractMarkedSegment(norm, rawText, ["funcionario","funcionaria","paciente"]);
    if(funcionario){ result.funcionario = funcionario; fields.push("funcionário: "+funcionario); }

    for(const tipo of TIPOS_SUGERIDOS){
      if(norm.includes(stripAccents(tipo))){ result.tipo = tipo; fields.push("tipo: "+tipo); break; }
    }

    const foundExams = [];
    for(const [code, syns] of Object.entries(EXAM_SYNONYMS)){
      if(syns.some(s=>norm.includes(s))){ result.exams[code]=true; foundExams.push(code); }
    }
    if(foundExams.length) fields.push("exames: "+foundExams.join(", "));

    return { result, fields };
  }

  function pushMessage(msg){
    state.chatMessages = [...state.chatMessages, msg];
    render();
    const body = document.querySelector(".chat-body");
    if(body) body.scrollTop = body.scrollHeight;
  }

  function speak(text){
    if(!state.speechEnabled) return;
    if(!("speechSynthesis" in window)) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "pt-BR"; u.rate = 1; window.speechSynthesis.speak(u);
    } catch(_){}
  }

  function buildSpokenSummary(result, medico){
    const parts = [];
    if(result.empresa) parts.push(`empresa ${result.empresa}`);
    if(result.funcionario) parts.push(`funcionário ${result.funcionario}`);
    if(result.tipo) parts.push(`tipo ${result.tipo}`);
    if(result.horario) parts.push(`às ${result.horario}`);
    const exams = result.exames || Object.keys(result.exams||{});
    if(exams && exams.length) parts.push(`exames ${exams.join(", ")}`);
    if(medico) parts.push(`médico ${medico}`);
    return parts.join(", ");
  }

  async function confirmAppointment(){
    if(!state.pendingAppointment) return;
    const p = state.pendingAppointment;
    const cleanExams = {};
    Object.keys(p.exams||{}).forEach(k=>{ if(p.exams[k]) cleanExams[k]=1; });
    const medico = cleanExams.CLINICO ? getMedicoForDate(state.date, p.horario) : null;
    
    const entryId = uid();
    const entryData = { id: entryId, date: state.date, horario:p.horario, empresa:p.empresa, tipo:p.tipo, funcionario:p.funcionario, exams: cleanExams, medico };

    try {
      await setDoc(doc(db, "agendamentos", entryId), entryData);
      
      state.pendingAppointment = null;
      state.awaitingConfirmation = false;
      pushMessage({ role:"assistant", text: medico ? `✅ Agendamento adicionado com ${medico}!` : "✅ Agendamento adicionado com sucesso!" });
      speak(medico ? `Agendamento confirmado com ${medico}.` : "Agendamento confirmado e adicionado.");
    } catch (err) {
      pushMessage({ role:"error", text: "Erro ao salvar na nuvem." });
    }
  }

  function cancelPendingAppointment(){
    state.pendingAppointment = null;
    state.awaitingConfirmation = false;
    pushMessage({ role:"assistant", text:"Ok, não adicionei esse agendamento." });
    speak("Tudo bem, cancelado.");
  }

  function applyParsedResult(result, fields, source){
    const exams = result.exames || Object.keys(result.exams||{});
    const prefix = source==="ai" ? "🤖 " : "🔤 ";

    if(!fields.length){
      pushMessage({ role:"assistant", text: prefix+'Não consegui identificar nenhum campo. Tente algo como: "horário 8 horas, empresa Paraty, tipo periódico, exames clínico".' });
      speak("Não entendi. Pode repetir dizendo o horário e a empresa?");
      return;
    }

    const canConfirm = !!result.horario && (!!result.empresa || !!result.funcionario);
    const medico = (result.horario && exams.includes("CLINICO")) ? getMedicoForDate(state.date, result.horario) : null;
    const displayFields = medico ? [...fields, "médico: "+medico] : fields;

    if(canConfirm){
      state.pendingAppointment = { horario: result.horario, empresa: result.empresa||"", funcionario: result.funcionario||"", tipo: result.tipo||"", exams: Object.fromEntries(exams.map(k=>[k,true])) };
      state.awaitingConfirmation = true;
      const summary = buildSpokenSummary(result, medico);
      pushMessage({ role:"assistant", text: prefix+"Entendi: "+summary+". Confirma o agendamento?", fields: displayFields, confirm:true });
      speak(`Você quer agendar ${summary}. Confirma?`);
    } else {
      if(result.horario) state.form.horario = result.horario;
      if(result.empresa) state.form.empresa = result.empresa;
      if(result.funcionario) state.form.funcionario = result.funcionario;
      if(result.tipo) state.form.tipo = result.tipo;
      exams.forEach(k=>{ if(EXAMS.includes(k)) state.form.exams[k]=true; });
      if(state.viewMode!=="day") state.viewMode = "day";
      pushMessage({ role:"assistant", text: prefix+"Preenchi o que entendi no formulário — falta horário ou empresa/funcionário para eu confirmar direto. Complete e clique em Adicionar.", fields: displayFields });
      speak("Preenchi o formulário, mas falta horário ou empresa. Confira e adicione manualmente.");
    }
  }

  async function interpretWithAI(rawText){
    state.aiThinking = true; render();
    try {
      const system = `Você extrai dados de agendamentos de exames ocupacionais ditados por voz em português do Brasil.
  Responda APENAS com um JSON válido, sem markdown, sem explicações, no formato exato:
  {"horario": "HH:MM" ou null, "empresa": string ou null, "funcionario": string ou null, "tipo": um destes valores exatamente ou null [${TIPOS_SUGERIDOS.map(t=>`"${t}"`).join(", ")}], "exames": array com zero ou mais destes códigos exatamente [${EXAMS.map(e=>`"${e}"`).join(", ")}]}
  Interprete sinônimos (ex: "audiometria" = AUDIO, "raio-x" = RX, "eletro" = ECG). Se a pessoa se corrigir ("não, na verdade..."), use a versão corrigida. Se algo não for mencionado, use null ou array vazio.`;

      let resp = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: { "content-type": "application/json", "x-api-key": state.apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
          body: JSON.stringify({ model: "claude-haiku-4-5-20251001", max_tokens: 300, system, messages: [{ role: "user", content: rawText }] })
      });
      
      if(!resp.ok){ throw new Error(resp.status===401 ? "Chave de API inválida ou expirada." : "Erro na API"); }
      const data = await resp.json();
      const textOut = (data.content||[]).map(b=>b.text||"").join("").trim();
      const clean = textOut.replace(/```json|```/g,"").trim();
      const parsed = JSON.parse(clean);
      if(parsed.horario) parsed.horario = roundToHalfHour(parsed.horario);
      const fields = [];
      if(parsed.horario) fields.push("horário "+parsed.horario);
      if(parsed.empresa) fields.push("empresa: "+parsed.empresa);
      if(parsed.funcionario) fields.push("funcionário: "+parsed.funcionario);
      if(parsed.tipo) fields.push("tipo: "+parsed.tipo);
      if(parsed.exames && parsed.exames.length) fields.push("exames: "+parsed.exames.join(", "));
      applyParsedResult(parsed, fields, "ai");
    } catch(err){
      pushMessage({ role:"error", text:"⚠️ IA indisponível: " + err.message + " Usando reconhecimento por palavras-chave como reserva." });
      const { result, fields } = parseVoiceCommand(rawText);
      applyParsedResult({...result, exames: Object.keys(result.exams)}, fields, "rules");
    } finally {
      state.aiThinking = false; render();
    }
  }

  function handleTranscript(rawText){
    pushMessage({ role:"user", text: rawText });
    if(state.awaitingConfirmation){
      const norm = stripAccents(rawText);
      const yes = /\b(sim|confirma|confirmar|pode|isso mesmo|correto|positivo|exato)\b/.test(norm);
      const no = /\b(nao|cancela|cancelar|errado|negativo|espera)\b/.test(norm);
      if(yes){ confirmAppointment(); return; }
      if(no){ cancelPendingAppointment(); return; }
      pushMessage({ role:"assistant", text:'Não entendi — diga "sim" para confirmar ou "não" para cancelar.' });
      speak("Não entendi. Diga sim para confirmar, ou não para cancelar.");
      return;
    }
    if(state.apiKey){ interpretWithAI(rawText); } else {
      const { result, fields } = parseVoiceCommand(rawText);
      applyParsedResult({...result, exames: Object.keys(result.exams)}, fields, "rules");
    }
  }

  function saveApiKey(){
    const key = state.apiKeyDraft.trim(); if(!key) return;
    localStorage.setItem("claude-api-key", key); state.apiKey = key; state.apiKeyDraft = ""; render();
  }
  function removeApiKey(){ localStorage.removeItem("claude-api-key"); state.apiKey = ""; render(); }

  function startListening(){
    if(!MIC_SUPPORTED){ pushMessage({ role:"error", text:"Seu navegador não tem suporte a ditado por voz. Funciona no Chrome ou Edge." }); return; }
    if(!recognition){
      recognition = new SpeechRecognitionCtor();
      recognition.lang = "pt-BR"; recognition.interimResults = false; recognition.maxAlternatives = 1;
      recognition.onstart = ()=>{ state.listening = true; render(); };
      recognition.onresult = (e)=>{ const text = e.results[0][0]?.transcript || ""; if(text.trim()) handleTranscript(text); };
      recognition.onerror = (e)=>{
        const messages = {
          "not-allowed": "Permissão de microfone negada.", "service-not-allowed": "O serviço de reconhecimento de voz foi bloqueado.",
          "network": "Falha de rede no reconhecimento de voz.", "no-speech": "Não ouvi nada. Toque no microfone e fale novamente.",
          "audio-capture": "Nenhum microfone encontrado.", "aborted": null
        };
        if(messages[e.error]) pushMessage({ role:"error", text: "⚠️ " + messages[e.error] });
        state.listening = false; render();
      };
      recognition.onend = ()=>{ state.listening = false; render(); };
    }
    try { recognition.start(); state.listening = true; render(); } catch(err){
      try { recognition.stop(); } catch(_){}
      state.listening = false; pushMessage({ role:"error", text:"⚠️ Erro ao iniciar microfone. Toque novamente." }); render();
    }
  }

  function stopListening(){ if(recognition){ try { recognition.stop(); } catch(_){} } state.listening = false; render(); }
  function toggleWidget(){ state.widgetOpen = !state.widgetOpen; render(); }

  // --- FUNÇÕES DE RENDERIZAÇÃO DA INTERFACE ---
  function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstChild; }
  function esc(s){ return (s??"").toString().replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

  function renderTabs(){
    const tabs = document.getElementById("tabs"); tabs.innerHTML = "";
    [["day","Dia"],["month","Mês"],["year","Ano"]].forEach(([id,label])=>{
      const b = el(`<button class="tab ${state.viewMode===id?'active':''}">${label}</button>`);
      b.onclick = ()=>{
        if(id==="month") state.monthCursor = state.date.slice(0,7);
        if(id==="year") state.yearCursor = Number(state.date.slice(0,4));
        setState({ viewMode:id });
      };
      tabs.appendChild(b);
    });
  }

  function renderNav(){
    const nav = document.getElementById("nav"); nav.innerHTML = "";
    if(state.viewMode==="day"){
      const prev = el(`<button class="btn-ghost">‹</button>`); prev.onclick=()=>changeDate(shiftDate(state.date,-1));
      const box = el(`<div class="datebox">📅 <input type="date" value="${state.date}"></div>`);
      box.querySelector("input").onchange = (e)=>changeDate(e.target.value);

      today.onclick = ()=>setState({monthCursor: todayISO().slice(0,7)});
      const total = Object.entries(state.index).filter(([d])=>d.startsWith(state.monthCursor)).reduce((s,[,c])=>s+c,0);
      const info = el(`<span class="mono" style="color:rgba(255,255,255,.8);font-size:13px;">${total} agendamento${total!==1?"s":""} no mês</span>`);

      today.onclick = ()=>setState({yearCursor: Number(todayISO().slice(0,4))});
      const total = Object.entries(state.index).filter(([d])=>d.startsWith(String(state.yearCursor))).reduce((s,[,c])=>s+c,0);
      const info = el(`<span class="mono" style="color:rgba(255,255,255,.8);font-size:13px;">${total} agendamento${total!==1?"s":""} no ano</span>`);
      nav.append(prev,label,next,today,info);
    }
  }

  function computeTotals(entries){
    const t = emptyExams(); EXAMS.forEach(k=>t[k]=0);
    entries.forEach(e=>{ EXAMS.forEach(k=>{ const v=e.exams?.[k]; if(v) t[k]+=Number(v); }); });
    return t;
  }

  function renderDayView(){

    const left = el(`<div></div>`);
    const right = el(`<div></div>`);

      }

        tr.appendChild(el(`<td>${esc(entry.empresa)||"—"}</td>`));
        tr.appendChild(el(`<td style="color:#6B7280;">${esc(entry.tipo)||"—"}</td>`));

      wrap.appendChild(table); tableCard.appendChild(wrap);

    const grand = Object.values(totals).reduce((a,b)=>a+b,0);
    summaryCard.appendChild(el(`<div class="stats2">
      <div class="stat"><p class="label">Agendamentos</p><p class="value" style="color:var(--navy);">${state.entries.length}</p></div>
      <div class="stat"><p class="label">Exames no total</p><p class="value" style="color:var(--teal);">${grand}</p></div>
    </div>`));

    else {
      const max = Math.max(...chartData.map(d=>d.total)); const chart = el(`<div></div>`);
      chartData.forEach(d=>{
        const pct = Math.max(6, Math.round((d.total/max)*100));
        chart.appendChild(el(`<div class="bar-row"><span class="bar-label">${d.name}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%;"></div></div><span class="bar-val">${d.total}</span></div>`));
      });
      summaryCard.appendChild(chart);

    right.appendChild(summaryCard);

    // 2) NOVO CARTÃO: ATENDIMENTOS POR MÉDICO (TIPOS E QUANTIDADE)

    const docStats = {};

        docStats[e.medico].total++;
        const t = e.tipo || "Sem tipo";
        docStats[e.medico].tipos[t] = (docStats[e.medico].tipos[t] || 0) + 1;
      }
    });

    const docKeys = Object.keys(docStats).sort();

      docCard.appendChild(el(`<p style="font-size:13px;color:#9CA3AF;margin:0;text-align:center;padding:16px 0;">Nenhum atendimento médico registrado para hoje.</p>`));

          </div>

        list.appendChild(item);
      });
      docCard.appendChild(list);

    // 3) CARTÃO: ESCALA DA SEMANA

      scheduleCard.appendChild(list);
    }
    right.appendChild(scheduleCard);

    // 4) CARTÃO: LISTA PSICO (COM BOTÃO IMPRIMIR)

    // Adiciona o botão de gerar PDF (imprimir) se houverem entradas
    if(psicoEntries.length > 0){

        const w = window.open('', '_blank');

          <style>
            body{font-family:sans-serif;padding:20px;color:#1A2B32;}
            h1{font-size:20px;border-bottom:2px solid #1F4E5F;padding-bottom:10px;margin-bottom:20px;}
            table{width:100%;border-collapse:collapse;font-size:14px;}
            th,td{border:1px solid #DCD6C9;padding:12px;text-align:left;}
            th{background:#F6F4EF;color:#1F4E5F;text-transform:uppercase;font-size:12px;}
          </style>
          </head><body>
          <h1>Lista de Exames Psicológicos - ${fmtWeekday(state.date)}</h1>
          <table>
            <thead><tr><th>Horário</th><th>Funcionário(a)</th><th>Empresa</th><th>Tipo</th></tr></thead>
            <tbody>`;
        psicoEntries.forEach(e => {
          html += `<tr>
            <td style="font-family:monospace;font-weight:bold;">${esc(e.horario)||'--:--'}</td>
            <td><b>${esc(e.funcionario)||'—'}</b></td>
            <td>${esc(e.empresa)||'—'}</td>
            <td>${esc(e.tipo)||'—'}</td>
          </tr>`;
        });
        html += `</tbody></table>
          <script>
            window.onload = function() { window.print(); window.close(); }
          <\/script>
          </body></html>`;
        w.document.write(html);
        w.document.close();
      };
      psicoHead.appendChild(printBtn);
    }
    psicoCard.appendChild(psicoHead);

    if(psicoEntries.length === 0){ 
      psicoCard.appendChild(el(`<p style="font-size:13px;color:#9CA3AF;margin:0;">Nenhum agendamento com PSICO hoje.</p>`)); 
    } else {
      const list = el(`<div style="display:flex;flex-direction:column;gap:8px;"></div>`);
      psicoEntries.forEach(e=>{ list.appendChild(el(`<div style="background:var(--paper);border-radius:8px;padding:8px 10px;"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;"><span style="font-size:13px;font-weight:700;color:var(--ink);">${esc(e.funcionario)||"—"}</span><span class="mono" style="font-size:11px;color:var(--navy);font-weight:700;">${esc(e.horario)||""}</span></div><div style="font-size:12px;color:#6B7280;margin-top:2px;">${esc(e.tipo)||"tipo não informado"} · ${esc(e.empresa)||"empresa não informada"}</div></div>`)); });
      psicoCard.appendChild(list);
    }
    right.appendChild(psicoCard);

    right.appendChild(el(`<div class="tips"><p class="k">como funciona</p><ul><li>• Digite o horário — o sistema ordena tudo automaticamente.</li><li>• Use as abas Mês/Ano para ver a agenda inteira de uma vez.</li><li>• Ao marcar CLÍNICO, o médico responsável é identificado sozinho.</li><li>• ☁️ Seus dados estão salvos em nuvem (Firebase).</li></ul></div>`));
    container.append(left,right); return container;
  }

  function renderMonthView(){
    const card = el(`<div class="card"></div>`);

      if(!iso){ grid.appendChild(el(`<div></div>`)); return; }
      const count = state.index[iso]||0; const isToday = iso===todayStr; const dayNum = Number(iso.slice(8,10));
      const cell = el(`<button class="day-cell ${count>0?'has':''} ${isToday?'today':''}"><span class="day-num">${dayNum}</span>${count>0?`<span class="day-badge">${count}</span>`:""}</button>`);
      cell.onclick = ()=>goToDay(iso); grid.appendChild(cell);
    });
    card.appendChild(grid); return card;
  }

          else {
            const b = el(`<div class="bubble assistant">${esc(msg.text)}</div>`);
            if(msg.fields && msg.fields.length){ const fw = el(`<div class="fields"></div>`); msg.fields.forEach(f=> fw.appendChild(el(`<span class="chip">${esc(f)}</span>`))); b.appendChild(fw); }
            if(msg.confirm && idx === state.chatMessages.length-1 && state.awaitingConfirmation){
              const actions = el(`<div style="display:flex;gap:6px;margin-top:8px;"></div>`);
              const okBtn = el(`<button style="flex:1;border:none;border-radius:7px;padding:7px;font-size:12px;font-weight:700;cursor:pointer;background:var(--good-fg);color:#fff;">✅ Confirmar</button>`); okBtn.onclick = confirmAppointment;
              const noBtn = el(`<button style="flex:1;border:none;border-radius:7px;padding:7px;font-size:12px;font-weight:700;cursor:pointer;background:#FEE2E2;color:#DC2626;">✖️ Cancelar</button>`); noBtn.onclick = cancelPendingAppointment;
              actions.append(okBtn,noBtn); b.appendChild(actions);
            }
            const row = el(`<div class="bubble-row assistant"></div>`); row.appendChild(b); body.appendChild(row);
          }
        });
      }
      if(state.aiThinking){ body.appendChild(el(`<div class="bubble-row assistant"><div class="bubble assistant"><span class="thinking-dots"><span></span><span></span><span></span></span></div></div>`)); }
      panel.appendChild(body);

      const foot = el(`<div class="chat-foot"></div>`);
      const talkBtn = el(`<button type="button" class="talk-btn ${state.listening?'listening':''}" ${state.aiThinking?'disabled':''}>${state.listening?'⏺️ Ouvindo… toque para parar':'🎙️ Toque e fale'}</button>`);
      talkBtn.onclick = ()=> state.listening ? stopListening() : startListening(); foot.appendChild(talkBtn);
      foot.appendChild(el(`<p class="chat-foot-hint">Funciona melhor no Chrome/Edge, com internet.</p>`)); panel.appendChild(foot);
      host.appendChild(panel);
      requestAnimationFrame(()=>{ const b=host.querySelector(".chat-body"); if(b) b.scrollTop = b.scrollHeight; });
    }

    const fab = el(`<button class="fab ${state.listening?'listening':''} ${state.aiThinking?'thinking':''}" title="Assistente de voz">${state.listening?'⏺️':(state.aiThinking?'🤖':'🎙️')}</button>`);
    fab.onclick = toggleWidget; if(state.apiKey) fab.appendChild(el(`<span class="fab-dot" title="IA ativada"></span>`));
    host.appendChild(fab);
  }

  function render(){
    renderTabs(); renderNav();
    const main = document.getElementById("main"); main.innerHTML = "";
    const wrap = el(`<div class="wrap" style="padding-top:0;"></div>`);
    if(state.viewMode==="day") wrap.appendChild(renderDayView()); else if(state.viewMode==="month") wrap.appendChild(renderMonthView()); else wrap.appendChild(renderYearView());
    main.appendChild(wrap); renderVoiceWidget();
  }

  // Inicia com a tela limpa esperando os dados chegarem da nuvem
  render();
</script>
