<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agenda de Exames Ocupacionais</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');
  :root{
    --navy:#1F4E5F; --teal:#2E86AB; --ink:#1A2B32; --paper:#F6F4EF; --line:#DCD6C9;
    --good-bg:#E4F5EC; --good-fg:#1F8A55; --amber-bg:#FEF3C7; --amber-fg:#92400E;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  header{background:linear-gradient(120deg,var(--navy),var(--teal));color:#fff;}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 20px;}
  h1{font-size:22px;font-weight:800;margin:0;}
  .sub{color:rgba(255,255,255,.7);font-size:13px;margin:2px 0 0;}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .top{justify-content:space-between;}
  .tabs{display:flex;background:rgba(255,255,255,.1);border-radius:10px;padding:4px;gap:4px;}
  .tab{border:none;background:transparent;color:rgba(255,255,255,.8);font-weight:600;font-size:12px;
       padding:7px 12px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:6px;}
  .tab.active{background:#fff;color:var(--navy);}
  .nav{margin-top:18px;}
  .btn-ghost{background:rgba(255,255,255,.1);border:none;color:#fff;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px;}
  .btn-ghost:hover{background:rgba(255,255,255,.2);}
  .datebox{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border-radius:8px;padding:8px 12px;}
  .datebox input{background:transparent;border:none;color:#fff;font-weight:600;font-size:13px;outline:none;}
  main{max-width:1100px;margin:0 auto;padding:24px 20px;}
  .grid5{display:grid;grid-template-columns:3fr 2fr;gap:22px;}
  @media (max-width:900px){.grid5{grid-template-columns:1fr;}}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px;}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--navy);font-weight:800;margin:0 0 14px;}
  .form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  @media (max-width:640px){.form-grid{grid-template-columns:1fr 1fr;}}
  label.field{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:700;color:#6B7280;}
  input[type=text],input[type=time],input[type=date],input[type=number]{
    border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;font-family:inherit;
  }
  .exam-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:8px;}
  @media (max-width:640px){.exam-grid{grid-template-columns:repeat(4,1fr);}}
  .exam-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    border:1px solid var(--line);background:#fff;color:#6B7280;border-radius:10px;padding:9px 4px;cursor:pointer;
    font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;transition:transform .12s;}
  .exam-btn:hover{transform:translateY(-1px);}
  .exam-btn.active{background:var(--good-fg);border-color:var(--good-fg);color:#fff;}
  .submit-btn{margin-top:16px;display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;
    border:none;padding:11px 18px;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer;}
  .submit-btn:hover{opacity:.9;}
  .err{margin-top:10px;background:var(--amber-bg);color:var(--amber-fg);padding:9px 12px;border-radius:8px;font-size:13px;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:#9CA3AF;
     padding:8px 12px;border-bottom:1px solid var(--line);}
  td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .chip{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;
        padding:2px 6px;border-radius:6px;background:var(--good-bg);color:var(--good-fg);border:1px solid var(--good-fg);margin:1px;}
  .icon-btn{border:none;background:transparent;cursor:pointer;padding:6px;border-radius:6px;color:#6B7280;}
  .icon-btn:hover{background:#F3F4F6;}
  .empty{text-align:center;color:#9CA3AF;font-size:14px;padding:36px 10px;}
  .stat{background:var(--paper);border-radius:10px;padding:12px;}
  .stat p.label{font-size:10.5px;text-transform:uppercase;color:#9CA3AF;margin:0 0 3px;font-family:'JetBrains Mono',monospace;}
  .stat p.value{font-size:24px;font-weight:800;margin:0;font-family:'JetBrains Mono',monospace;}
  .stats2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .bar-label{width:70px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink);flex-shrink:0;text-align:right;}
  .bar-track{flex:1;background:#F3F4F6;border-radius:5px;height:16px;position:relative;overflow:hidden;}
  .bar-fill{background:var(--teal);height:100%;border-radius:5px;}
  .bar-val{width:26px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#6B7280;text-align:left;}
  .tips{border-radius:14px;padding:20px;color:#fff;background:linear-gradient(135deg,var(--navy),var(--teal));}
  .tips p.k{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:rgba(255,255,255,.7);
            font-family:'JetBrains Mono',monospace;margin:0 0 6px;}
  .tips ul{margin:0;padding-left:0;list-style:none;font-size:14px;line-height:1.7;color:rgba(255,255,255,.92);}
  .month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
  .wk-lbl{text-align:center;font-size:10.5px;text-transform:uppercase;color:#9CA3AF;font-weight:800;
          font-family:'JetBrains Mono',monospace;margin-bottom:4px;}
  .day-cell{min-height:64px;border:1px solid var(--line);border-radius:9px;padding:8px;text-align:left;
    background:#fff;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;}
  .day-cell:hover{transform:translateY(-1px);}
  .day-cell.has{background:var(--good-bg);}
  .day-cell.today{border-width:2px;border-color:var(--navy);}
  .day-num{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;}
  .day-badge{align-self:flex-start;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:800;
    background:var(--good-fg);color:#fff;padding:2px 6px;border-radius:6px;}
  .year-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media (max-width:800px){.year-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:520px){.year-grid{grid-template-columns:1fr;}}
  .month-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;text-align:left;}
  .month-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .month-card-top .name{font-weight:800;font-size:13px;color:var(--navy);}
  .mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .mini-cell{aspect-ratio:1;border-radius:2px;}
  select, .free-input{width:100%;}
  .mic-hint{font-size:12px;color:#9CA3AF;margin:0;}
  .mic-warn{color:var(--amber-fg);}
  .ai-toggle{background:transparent;border:1px solid var(--line);color:var(--navy);font-weight:700;font-size:12px;
    padding:7px 12px;border-radius:999px;cursor:pointer;}
  .ai-toggle.on{border-color:var(--good-fg);color:var(--good-fg);background:var(--good-bg);}
  .ai-panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:10px;}
  .ai-panel p{font-size:12.5px;color:#4B5563;line-height:1.6;margin:0 0 10px;}
  .ai-panel a{color:var(--teal);}
  .ai-key-row{display:flex;gap:8px;flex-wrap:wrap;}
  .ai-key-row input{flex:1;min-width:200px;}
  .ai-key-row button{border:none;border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .ai-save{background:var(--navy);color:#fff;}
  .ai-remove{background:#FEE2E2;color:#DC2626;}
  .ai-status{margin-top:8px;font-size:12px;font-weight:700;}
  .ai-status.on{color:var(--good-fg);}
  .ai-status.off{color:#9CA3AF;}
  .logo-badge{display:flex;align-items:center;}
  .logo-badge img{height:150px;display:block;}

  /* ---- floating voice assistant widget ---- */
  .fab{position:fixed;left:22px;bottom:22px;width:60px;height:60px;border-radius:50%;border:none;
    background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff;font-size:24px;cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:1000;display:flex;align-items:center;justify-content:center;
    transition:transform .15s ease;}
  .fab:hover{transform:scale(1.06);}
  .fab.listening{background:#DC2626;animation:fabpulse 1.3s infinite;}
  .fab.thinking{background:var(--teal);}
  @keyframes fabpulse{0%{box-shadow:0 0 0 0 rgba(220,38,38,.5);}70%{box-shadow:0 0 0 16px rgba(220,38,38,0);}100%{box-shadow:0 0 0 0 rgba(220,38,38,0);}}
  .fab-dot{position:absolute;top:2px;right:2px;width:14px;height:14px;border-radius:50%;background:var(--good-fg);
    border:2px solid #fff;}
  .chat-panel{position:fixed;left:22px;bottom:94px;width:340px;max-width:calc(100vw - 44px);max-height:70vh;
    background:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.22);display:flex;flex-direction:column;
    overflow:hidden;z-index:1000;border:1px solid var(--line);}
  .chat-head{background:linear-gradient(120deg,var(--navy),var(--teal));color:#fff;padding:12px 14px;
    display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .chat-head .title{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13.5px;}
  .chat-head .status{font-size:11px;color:rgba(255,255,255,.8);font-weight:600;}
  .chat-head-btns{display:flex;gap:4px;}
  .chat-head-btns button{background:rgba(255,255,255,.15);border:none;color:#fff;width:26px;height:26px;
    border-radius:7px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;}
  .chat-head-btns button:hover{background:rgba(255,255,255,.28);}
  .chat-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--paper);}
  .bubble-row{display:flex;}
  .bubble-row.user{justify-content:flex-end;}
  .bubble-row.assistant{justify-content:flex-start;}
  .bubble{max-width:85%;padding:9px 12px;border-radius:14px;font-size:13px;line-height:1.5;}
  .bubble.user{background:var(--navy);color:#fff;border-bottom-right-radius:4px;}
  .bubble.assistant{background:#fff;border:1px solid var(--line);color:var(--ink);border-bottom-left-radius:4px;}
  .bubble.error{background:var(--amber-bg);border:1px solid #F5D08A;color:var(--amber-fg);border-bottom-left-radius:4px;}
  .bubble .fields{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
  .thinking-dots{display:inline-flex;gap:3px;align-items:center;}
  .thinking-dots span{width:6px;height:6px;border-radius:50%;background:var(--teal);animation:bounce 1.2s infinite;}
  .thinking-dots span:nth-child(2){animation-delay:.15s;}
  .thinking-dots span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5;}30%{transform:translateY(-4px);opacity:1;}}
  .chat-empty{text-align:center;color:#9CA3AF;font-size:12.5px;padding:24px 10px;}
  .chat-foot{padding:12px;border-top:1px solid var(--line);background:#fff;}
  .talk-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:10px;
    padding:11px;font-weight:700;font-size:13.5px;cursor:pointer;background:var(--navy);color:#fff;}
  .talk-btn.listening{background:#DC2626;}
  .talk-btn:disabled{opacity:.5;cursor:not-allowed;}
  .chat-foot-hint{font-size:10.5px;color:#9CA3AF;text-align:center;margin:6px 0 0;}
  .medico-hint{margin-top:12px;padding:9px 12px;border-radius:9px;font-size:13px;}
  .medico-hint.ok{background:var(--good-bg);color:var(--good-fg);}
  .medico-hint.pending{background:var(--paper);color:#6B7280;border:1px dashed var(--line);}
  .medico-hint.warn{background:var(--amber-bg);color:var(--amber-fg);}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="row top">
      <div>
        <h1>Agenda de Exames Ocupacionais</h1>
      </div>
      <div class="logo-badge"><img src="logo.png" alt="Alpale Saúde Ocupacional"></div>
      <div class="tabs" id="tabs"></div>
    </div>
    <div class="row nav" id="nav"></div>
  </div>
</header>
<main id="main">
  <div style="text-align:center; padding: 40px; color: #1F4E5F;">
    <h2>Carregando sistema...</h2>
    <p>Conectando ao banco de dados seguro da Alpale.</p>
  </div>
</main>
<div id="voice-widget"></div>

<script type="module">
  // Usamos try-catch para proteger o carregamento do site.
  let db = null;
  let collection, doc, setDoc, deleteDoc, onSnapshot;

  try {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js");
    const firestore = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js");
    
    collection = firestore.collection;
    doc = firestore.doc;
    setDoc = firestore.setDoc;
    deleteDoc = firestore.deleteDoc;
    onSnapshot = firestore.onSnapshot;

    const firebaseConfig = {
      apiKey: "AIzaSyAL2xXqo83pWKhyCta4Nk0gockDstxtJY4",
      authDomain: "agendamento-alpale.firebaseapp.com",
      projectId: "agendamento-alpale",
      storageBucket: "agendamento-alpale.firebasestorage.app",
      messagingSenderId: "491340347533",
      appId: "1:491340347533:web:0983b4dba5bbdcc534cac4"
    };

    const app = initializeApp(firebaseConfig);
    db = firestore.getFirestore(app);
  } catch(error) {
    console.error("Erro ao conectar no Firebase: ", error);
    alert("Houve um problema de conexão com o servidor. O site funcionará no modo offline temporariamente.");
  }

  // --- DADOS BÁSICOS DO SISTEMA ---
  const EXAMS = ["CLINICO","AUDIO","EEG","ECG","ACV","ESP","ISHI","RX","LAB","PSICO","CINESIO","ODONTO","TOXIC","OTOLOGICO","VOCAL"];
  const TIPOS_SUGERIDOS = ["Admissional","Periódico","Demissional","Mudança de Função","Mudança de Risco","Retorno","Revalidação"];
  const WEEKDAY_LABELS = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  const MONTH_LABELS = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

  function pad2(n){ return String(n).padStart(2,"0"); }
  function roundToHalfHour(hhmm){
    const [h,m] = hhmm.split(":").map(Number);
    let totalMin = h*60 + m;
    totalMin = Math.round(totalMin/30)*30;
    totalMin = ((totalMin % 1440) + 1440) % 1440;
    return `${pad2(Math.floor(totalMin/60))}:${pad2(totalMin%60)}`;
  }

  const SCHEDULE_BY_WEEKDAY = {
    1: [ { start:"06:30", end:"10:30", medico:"Dra. Gizelle" }, { start:"11:00", end:"13:00", medico:"Dr. Luiz" }, { start:"16:00", end:"17:00", medico:"Dra. Nadia" } ],
    2: [ { start:"06:30", end:"10:30", medico:"Dra. Gizelle" }, { start:"11:00", end:"13:00", medico:"Dra. Nadia" }, { start:"14:30", end:"16:00", medico:"Dr. Luiz" } ],
    3: [ { start:"06:30", end:"10:30", medico:"Dra. Gizelle" }, { start:"11:00", end:"13:00", medico:"Dr. Luiz" } ],
    4: [ { start:"06:30", end:"10:30", medico:"Dra. Louane" }, { start:"11:00", end:"13:00", medico:"Dra. Nadia" }, { start:"13:30", end:"17:00", medico:"Dra. Gizelle" } ],
    5: [ { start:"06:30", end:"10:30", medico:"Dra. Louane" }, { start:"11:00", end:"13:00", medico:"Dra. Nadia" }, { start:"13:30", end:"16:00", medico:"Dr. Guilherme" } ],
  };
  const WEEKDAY_FULL = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];

  function timeToMin(hhmm){ const [h,m] = hhmm.split(":").map(Number); return h*60+m; }
  function getMedicoForSlot(weekday, hhmm){
    const slots = SCHEDULE_BY_WEEKDAY[weekday];
    if(!slots || !hhmm) return null;
    const t = timeToMin(hhmm);
    const hit = slots.find(s => t >= timeToMin(s.start) && t < timeToMin(s.end));
    return hit ? hit.medico : null;
  }
  function getMedicoForDate(dateISO, hhmm){
    if(!hhmm) return null;
    const weekday = new Date(dateISO+"T12:00:00").getDay();
    return getMedicoForSlot(weekday, hhmm);
  }
  function todayISO(){
    const d = new Date();
    const off = d.getTimezoneOffset();
    return new Date(d.getTime() - off*60000).toISOString().slice(0,10);
  }
  function fmtWeekday(iso){
    const d = new Date(iso+"T12:00:00");
    const s = d.toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"});
    return s.charAt(0).toUpperCase()+s.slice(1);
  }
  function shiftDate(iso,delta){
    const d = new Date(iso+"T12:00:00"); d.setDate(d.getDate()+delta);
    return d.toISOString().slice(0,10);
  }
  function shiftMonth(ym,delta){
    const [y,m] = ym.split("-").map(Number);
    const d = new Date(y, m-1+delta, 1);
    return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
  }
  function monthMatrix(ym){
    const [y,m] = ym.split("-").map(Number);
    const first = new Date(y,m-1,1);
    const startOffset = first.getDay();
    const daysInMonth = new Date(y,m,0).getDate();
    const cells = [];
    for(let i=0;i<startOffset;i++) cells.push(null);
    for(let d=1;d<=daysInMonth;d++) cells.push(`${y}-${pad2(m)}-${pad2(d)}`);
    while(cells.length%7!==0) cells.push(null);
    return cells;
  }
  function miniMonthMatrix(year, monthIndex0){
    const first = new Date(year, monthIndex0, 1);
    const startOffset = first.getDay();
    const daysInMonth = new Date(year, monthIndex0+1, 0).getDate();
    const cells = [];
    for(let i=0;i<startOffset;i++) cells.push(null);
    for(let d=1;d<=daysInMonth;d++) cells.push(`${year}-${pad2(monthIndex0+1)}-${pad2(d)}`);
    return cells;
  }
  function emptyExams(){ const o={}; EXAMS.forEach(k=>o[k]=false); return o; }
  
  function emptyForm(d){ 
    return { date: d || todayISO(), horario:"", empresa:"", tipo:"", funcionario:"", exams: emptyExams() }; 
  }
  
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  // ---------- state ----------
  const state = {
    date: todayISO(),
    viewMode: "day",
    monthCursor: todayISO().slice(0,7),
    yearCursor: Number(todayISO().slice(0,4)),
    allEntries: [], 
    entries: [],    
    index: {},      
    form: emptyForm(todayISO()),
    editingId: null,
    formError: "",
    confirmDeleteId: null,
    error: "",
    listening: false,
    aiThinking: false,
    micError: "",
    apiKey: localStorage.getItem("claude-api-key") || "",
    showAiPanel: false,
    apiKeyDraft: "",
    widgetOpen: false,
    chatMessages: [], 
    speechEnabled: true,
    pendingAppointment: null,
    awaitingConfirmation: false
  };

  function setState(patch){ Object.assign(state, patch); render(); }

  // --- ESCUTANDO O FIREBASE EM TEMPO REAL ---
  if(db) {
    onSnapshot(collection(db, "agendamentos"), (snapshot) => {
      const all = [];
      const idx = {};
      snapshot.forEach(d => {
        const data = d.data();
        all.push(data);
        idx[data.date] = (idx[data.date] || 0) + 1;
      });
      state.allEntries = all;
      state.index = idx;
      state.entries = all.filter(e => e.date === state.date);
      render(); 
    });
  }

  // ---------- actions ----------
  function goToDay(iso){ setState({ date: iso, viewMode:"day", entries: state.allEntries.filter(e=>e.date===iso), form: emptyForm(iso), editingId:null, formError:"" }); }
  function changeDate(iso){ setState({ date: iso, entries: state.allEntries.filter(e=>e.date===iso), form: emptyForm(iso), editingId:null, formError:"" }); }
  function openMonth(ym){ setState({ monthCursor: ym, viewMode: "month" }); }

  function toggleExam(k){ state.form.exams[k] = !state.form.exams[k]; render(); }

  async function submitForm(e){
    e.preventDefault();
    const f = state.form;
    if(!f.horario){ setState({formError:"Informe o horário do agendamento."}); return; }
    if(!f.empresa.trim() && !f.funcionario.trim()){ setState({formError:"Informe ao menos a empresa ou o funcionário."}); return; }
    
    const cleanExams = {};
    EXAMS.forEach(k=>{ if(f.exams[k]) cleanExams[k]=1; });
    
    const targetDate = f.date || state.date;
    const medico = cleanExams.CLINICO ? getMedicoForDate(targetDate, f.horario) : null;

  // ---------- voice dictation ----------
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  const MIC_SUPPORTED = !!SpeechRecognitionCtor;
  let recognition = null;

  function stripAccents(s){ return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase(); }

  const EXAM_SYNONYMS = {
    CLINICO: ["clinico"], AUDIO: ["audio","audiometria"], EEG: ["eeg","eletroencefalograma"],
    ECG: ["ecg","eletrocardiograma"], ACV: ["acv","acuidade visual"], ESP: ["esp","espirometria"],
    ISHI: ["ishi","ishihara"], RX: ["rx","raio x","raio-x","raiox"], LAB: ["lab","laboratorial","laboratorio"],
    PSICO: ["psico","psicotecnico"], CINESIO: ["cinesio","cinesioteste","cinesiologico"],
    ODONTO: ["odonto","odontologico","dental"], TOXIC: ["toxic","toxicologico"], OTOLOGICO: ["otologico","otologia"],
    VOCAL: ["triagem vocal","vocal","fonoaudiologia"]
  };

  const TIME_WORDS = { "meio dia":"12:00", "meio-dia":"12:00", "meia noite":"00:00", "meia-noite":"00:00" };

  function extractHorario(norm){
    for(const [word,val] of Object.entries(TIME_WORDS)){
      if(norm.includes(word)) return roundToHalfHour(val);
    }
    const m = norm.match(/(\d{1,2})\s*(?:h|:|horas?)\s*(\d{1,2})?/);
    if(m){
      let hh = Math.min(23, parseInt(m[1],10));
      let mm = m[2] ? Math.min(59, parseInt(m[2],10)) : 0;
      return roundToHalfHour(`${pad2(hh)}:${pad2(mm)}`);
    }
    return null;
  }

  function extractMarkedSegment(norm, raw, markers){
    const allMarkers = ["horario","hora","empresa","funcionario","funcionaria","paciente","tipo","exame","exames"];
    for(const marker of markers){
      const idx = norm.indexOf(marker);
      if(idx===-1) continue;
      const afterStart = idx + marker.length;
      let end = raw.length;
      for(const other of allMarkers){
        if(other===marker) continue;
        const oIdx = norm.indexOf(other, afterStart);
        if(oIdx!==-1 && oIdx < end) end = oIdx;
      }
      const seg = raw.slice(afterStart, end).trim().replace(/^[:,-]\s*/,"");
      if(seg) return seg;
    }
    return null;
  }

  function parseVoiceCommand(rawText){
    const norm = stripAccents(rawText);
    const fields = [];
    const result = { horario:null, empresa:null, funcionario:null, tipo:null, exams:{} };

    const horario = extractHorario(norm);
    if(horario){ result.horario = horario; fields.push("horário "+horario); }

    const empresa = extractMarkedSegment(norm, rawText, ["empresa"]);
    if(empresa){ result.empresa = empresa; fields.push("empresa: "+empresa); }

    const funcionario = extractMarkedSegment(norm, rawText, ["funcionario","funcionaria","paciente"]);
    if(funcionario){ result.funcionario = funcionario; fields.push("funcionário: "+funcionario); }

    for(const tipo of TIPOS_SUGERIDOS){
      if(norm.includes(stripAccents(tipo))){ result.tipo = tipo; fields.push("tipo: "+tipo); break; }
    }

    const foundExams = [];
    for(const [code, syns] of Object.entries(EXAM_SYNONYMS)){
      if(syns.some(s=>norm.includes(s))){ result.exams[code]=true; foundExams.push(code); }
    }
    if(foundExams.length) fields.push("exames: "+foundExams.join(", "));

    return { result, fields };
  }

  function pushMessage(msg){
    state.chatMessages = [...state.chatMessages, msg];
    render();
    const body = document.querySelector(".chat-body");
    if(body) body.scrollTop = body.scrollHeight;
  }

  function speak(text){
    if(!state.speechEnabled) return;
    if(!("speechSynthesis" in window)) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "pt-BR"; u.rate = 1; window.speechSynthesis.speak(u);
    } catch(_){}
  }

  function buildSpokenSummary(result, medico){
    const parts = [];
    if(result.empresa) parts.push(`empresa ${result.empresa}`);
    if(result.funcionario) parts.push(`funcionário ${result.funcionario}`);
    if(result.tipo) parts.push(`tipo ${result.tipo}`);
    if(result.horario) parts.push(`às ${result.horario}`);
    const exams = result.exames || Object.keys(result.exams||{});
    if(exams && exams.length) parts.push(`exames ${exams.join(", ")}`);
    if(medico) parts.push(`médico ${medico}`);
    return parts.join(", ");
  }

  async function confirmAppointment(){
    if(!state.pendingAppointment) return;
    const p = state.pendingAppointment;
    const cleanExams = {};
    Object.keys(p.exams||{}).forEach(k=>{ if(p.exams[k]) cleanExams[k]=1; });
    const medico = cleanExams.CLINICO ? getMedicoForDate(state.date, p.horario) : null;
    
    const entryId = uid();
    const entryData = { id: entryId, date: state.date, horario:p.horario, empresa:p.empresa, tipo:p.tipo, funcionario:p.funcionario, exams: cleanExams, medico };

    try {
      if(db) await setDoc(doc(db, "agendamentos", entryId), entryData);
      
      state.pendingAppointment = null;
      state.awaitingConfirmation = false;
      pushMessage({ role:"assistant", text: medico ? `✅ Agendamento adicionado com ${medico}!` : "✅ Agendamento adicionado com sucesso!" });
      speak(medico ? `Agendamento confirmado com ${medico}.` : "Agendamento confirmado e adicionado.");
    } catch (err) {
      pushMessage({ role:"error", text: "Erro ao salvar na nuvem." });
    }
  }

  function cancelPendingAppointment(){
    state.pendingAppointment = null;
    state.awaitingConfirmation = false;
    pushMessage({ role:"assistant", text:"Ok, não adicionei esse agendamento." });
    speak("Tudo bem, cancelado.");
  }

  function applyParsedResult(result, fields, source){
    const exams = result.exames || Object.keys(result.exams||{});
    const prefix = source==="ai" ? "🤖 " : "🔤 ";

    if(!fields.length){
      pushMessage({ role:"assistant", text: prefix+'Não consegui identificar nenhum campo. Tente algo como: "horário 8 horas, empresa Paraty, tipo periódico, exames clínico".' });
      speak("Não entendi. Pode repetir dizendo o horário e a empresa?");
      return;
    }

    const canConfirm = !!result.horario && (!!result.empresa || !!result.funcionario);
    const medico = (result.horario && exams.includes("CLINICO")) ? getMedicoForDate(state.date, result.horario) : null;
    const displayFields = medico ? [...fields, "médico: "+medico] : fields;

    if(canConfirm){
      state.pendingAppointment = { horario: result.horario, empresa: result.empresa||"", funcionario: result.funcionario||"", tipo: result.tipo||"", exams: Object.fromEntries(exams.map(k=>[k,true])) };
      state.awaitingConfirmation = true;
      const summary = buildSpokenSummary(result, medico);
      pushMessage({ role:"assistant", text: prefix+"Entendi: "+summary+". Confirma o agendamento?", fields: displayFields, confirm:true });
      speak(`Você quer agendar ${summary}. Confirma?`);
    } else {
      if(result.horario) state.form.horario = result.horario;
      if(result.empresa) state.form.empresa = result.empresa;
      if(result.funcionario) state.form.funcionario = result.funcionario;
      if(result.tipo) state.form.tipo = result.tipo;
      exams.forEach(k=>{ if(EXAMS.includes(k)) state.form.exams[k]=true; });
      if(state.viewMode!=="day") state.viewMode = "day";
      pushMessage({ role:"assistant", text: prefix+"Preenchi o que entendi no formulário — falta horário ou empresa/funcionário para eu confirmar direto. Complete e clique em Adicionar.", fields: displayFields });
      speak("Preenchi o formulário, mas falta horário ou empresa. Confira e adicione manualmente.");
    }
  }
