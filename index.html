<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agenda de Exames Ocupacionais</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');
  :root{
    --navy:#1F4E5F; --teal:#2E86AB; --ink:#1A2B32; --paper:#F6F4EF; --line:#DCD6C9;
    --good-bg:#E4F5EC; --good-fg:#1F8A55; --amber-bg:#FEF3C7; --amber-fg:#92400E;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  header{background:linear-gradient(120deg,var(--navy),var(--teal));color:#fff;}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 20px;}
  h1{font-size:22px;font-weight:800;margin:0;}
  .sub{color:rgba(255,255,255,.7);font-size:13px;margin:2px 0 0;}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .top{justify-content:space-between;}
  .tabs{display:flex;background:rgba(255,255,255,.1);border-radius:10px;padding:4px;gap:4px;}
  .tab{border:none;background:transparent;color:rgba(255,255,255,.8);font-weight:600;font-size:12px;
       padding:7px 12px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:6px;}
  .tab.active{background:#fff;color:var(--navy);}
  .nav{margin-top:18px;}
  .btn-ghost{background:rgba(255,255,255,.1);border:none;color:#fff;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px;}
  .btn-ghost:hover{background:rgba(255,255,255,.2);}
  .datebox{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border-radius:8px;padding:8px 12px;}
  .datebox input{background:transparent;border:none;color:#fff;font-weight:600;font-size:13px;outline:none;}
  main{max-width:1100px;margin:0 auto;padding:24px 20px;}
  .grid5{display:grid;grid-template-columns:3fr 2fr;gap:22px;}
  @media (max-width:900px){.grid5{grid-template-columns:1fr;}}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px;}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--navy);font-weight:800;margin:0 0 14px;}
  .form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  @media (max-width:640px){.form-grid{grid-template-columns:1fr 1fr;}}
  label.field{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:700;color:#6B7280;}
  input[type=text],input[type=time],input[type=date],input[type=number]{
    border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;font-family:inherit;
  }
  .exam-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:8px;}
  @media (max-width:640px){.exam-grid{grid-template-columns:repeat(4,1fr);}}
  .exam-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    border:1px solid var(--line);background:#fff;color:#6B7280;border-radius:10px;padding:9px 4px;cursor:pointer;
    font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;transition:transform .12s;}
  .exam-btn:hover{transform:translateY(-1px);}
  .exam-btn.active{background:var(--good-fg);border-color:var(--good-fg);color:#fff;}
  .submit-btn{margin-top:16px;display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;
    border:none;padding:11px 18px;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer;}
  .submit-btn:hover{opacity:.9;}
  .err{margin-top:10px;background:var(--amber-bg);color:var(--amber-fg);padding:9px 12px;border-radius:8px;font-size:13px;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:#9CA3AF;
     padding:8px 12px;border-bottom:1px solid var(--line);}
  td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .chip{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;
        padding:2px 6px;border-radius:6px;background:var(--good-bg);color:var(--good-fg);border:1px solid var(--good-fg);margin:1px;}
  .icon-btn{border:none;background:transparent;cursor:pointer;padding:6px;border-radius:6px;color:#6B7280;}
  .icon-btn:hover{background:#F3F4F6;}
  .empty{text-align:center;color:#9CA3AF;font-size:14px;padding:36px 10px;}
  .stat{background:var(--paper);border-radius:10px;padding:12px;}
  .stat p.label{font-size:10.5px;text-transform:uppercase;color:#9CA3AF;margin:0 0 3px;font-family:'JetBrains Mono',monospace;}
  .stat p.value{font-size:24px;font-weight:800;margin:0;font-family:'JetBrains Mono',monospace;}
  .stats2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .bar-label{width:70px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink);flex-shrink:0;text-align:right;}
  .bar-track{flex:1;background:#F3F4F6;border-radius:5px;height:16px;position:relative;overflow:hidden;}
  .bar-fill{background:var(--teal);height:100%;border-radius:5px;}
  .bar-val{width:26px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#6B7280;text-align:left;}
  .tips{border-radius:14px;padding:20px;color:#fff;background:linear-gradient(135deg,var(--navy),var(--teal));}
  .tips p.k{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:rgba(255,255,255,.7);
            font-family:'JetBrains Mono',monospace;margin:0 0 6px;}
  .tips ul{margin:0;padding-left:0;list-style:none;font-size:14px;line-height:1.7;color:rgba(255,255,255,.92);}
  .month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
  .wk-lbl{text-align:center;font-size:10.5px;text-transform:uppercase;color:#9CA3AF;font-weight:800;
          font-family:'JetBrains Mono',monospace;margin-bottom:4px;}
  .day-cell{min-height:64px;border:1px solid var(--line);border-radius:9px;padding:8px;text-align:left;
    background:#fff;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;}
  .day-cell:hover{transform:translateY(-1px);}
  .day-cell.has{background:var(--good-bg);}
  .day-cell.today{border-width:2px;border-color:var(--navy);}
  .day-num{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;}
  .day-badge{align-self:flex-start;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:800;
    background:var(--good-fg);color:#fff;padding:2px 6px;border-radius:6px;}
  .year-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media (max-width:800px){.year-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:520px){.year-grid{grid-template-columns:1fr;}}
  .month-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;text-align:left;}
  .month-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .month-card-top .name{font-weight:800;font-size:13px;color:var(--navy);}
  .mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .mini-cell{aspect-ratio:1;border-radius:2px;}
  select, .free-input{width:100%;}
  .mic-hint{font-size:12px;color:#9CA3AF;margin:0;}
  .mic-warn{color:var(--amber-fg);}
  .ai-toggle{background:transparent;border:1px solid var(--line);color:var(--navy);font-weight:700;font-size:12px;
    padding:7px 12px;border-radius:999px;cursor:pointer;}
  .ai-toggle.on{border-color:var(--good-fg);color:var(--good-fg);background:var(--good-bg);}
  .ai-panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:10px;}
  .ai-panel p{font-size:12.5px;color:#4B5563;line-height:1.6;margin:0 0 10px;}
  .ai-panel a{color:var(--teal);}
  .ai-key-row{display:flex;gap:8px;flex-wrap:wrap;}
  .ai-key-row input{flex:1;min-width:200px;}
  .ai-key-row button{border:none;border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .ai-save{background:var(--navy);color:#fff;}
  .ai-remove{background:#FEE2E2;color:#DC2626;}
  .ai-status{margin-top:8px;font-size:12px;font-weight:700;}
  .ai-status.on{color:var(--good-fg);}
  .ai-status.off{color:#9CA3AF;}
  .logo-badge{display:flex;align-items:center;}
  .logo-badge img{height:150px;display:block;}

  /* ---- floating voice assistant widget ---- */
  .fab{position:fixed;left:22px;bottom:22px;width:60px;height:60px;border-radius:50%;border:none;
    background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff;font-size:24px;cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:1000;display:flex;align-items:center;justify-content:center;
    transition:transform .15s ease;}
  .fab:hover{transform:scale(1.06);}
  .fab.listening{background:#DC2626;animation:fabpulse 1.3s infinite;}
  .fab.thinking{background:var(--teal);}
  @keyframes fabpulse{0%{box-shadow:0 0 0 0 rgba(220,38,38,.5);}70%{box-shadow:0 0 0 16px rgba(220,38,38,0);}100%{box-shadow:0 0 0 0 rgba(220,38,38,0);}}
  .fab-dot{position:absolute;top:2px;right:2px;width:14px;height:14px;border-radius:50%;background:var(--good-fg);
    border:2px solid #fff;}
  .chat-panel{position:fixed;left:22px;bottom:94px;width:340px;max-width:calc(100vw - 44px);max-height:70vh;
    background:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.22);display:flex;flex-direction:column;
    overflow:hidden;z-index:1000;border:1px solid var(--line);}
  .chat-head{background:linear-gradient(120deg,var(--navy),var(--teal));color:#fff;padding:12px 14px;
    display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .chat-head .title{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13.5px;}
  .chat-head .status{font-size:11px;color:rgba(255,255,255,.8);font-weight:600;}
  .chat-head-btns{display:flex;gap:4px;}
  .chat-head-btns button{background:rgba(255,255,255,.15);border:none;color:#fff;width:26px;height:26px;
    border-radius:7px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;}
  .chat-head-btns button:hover{background:rgba(255,255,255,.28);}
  .chat-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--paper);}
  .bubble-row{display:flex;}
  .bubble-row.user{justify-content:flex-end;}
  .bubble-row.assistant{justify-content:flex-start;}
  .bubble{max-width:85%;padding:9px 12px;border-radius:14px;font-size:13px;line-height:1.5;}
  .bubble.user{background:var(--navy);color:#fff;border-bottom-right-radius:4px;}
  .bubble.assistant{background:#fff;border:1px solid var(--line);color:var(--ink);border-bottom-left-radius:4px;}
  .bubble.error{background:var(--amber-bg);border:1px solid #F5D08A;color:var(--amber-fg);border-bottom-left-radius:4px;}
  .bubble .fields{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
  .thinking-dots{display:inline-flex;gap:3px;align-items:center;}
  .thinking-dots span{width:6px;height:6px;border-radius:50%;background:var(--teal);animation:bounce 1.2s infinite;}
  .thinking-dots span:nth-child(2){animation-delay:.15s;}
  .thinking-dots span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5;}30%{transform:translateY(-4px);opacity:1;}}
  .chat-empty{text-align:center;color:#9CA3AF;font-size:12.5px;padding:24px 10px;}
  .chat-foot{padding:12px;border-top:1px solid var(--line);background:#fff;}
  .talk-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:10px;
    padding:11px;font-weight:700;font-size:13.5px;cursor:pointer;background:var(--navy);color:#fff;}
  .talk-btn.listening{background:#DC2626;}
  .talk-btn:disabled{opacity:.5;cursor:not-allowed;}
  .chat-foot-hint{font-size:10.5px;color:#9CA3AF;text-align:center;margin:6px 0 0;}
  .medico-hint{margin-top:12px;padding:9px 12px;border-radius:9px;font-size:13px;}
  .medico-hint.ok{background:var(--good-bg);color:var(--good-fg);}
  .medico-hint.pending{background:var(--paper);color:#6B7280;border:1px dashed var(--line);}
  .medico-hint.warn{background:var(--amber-bg);color:var(--amber-fg);}
</style>
</head>

  totalMin = Math.round(totalMin/30)*30;
  totalMin = ((totalMin % 1440) + 1440) % 1440;
  return `${pad2(Math.floor(totalMin/60))}:${pad2(totalMin%60)}`;
}

// ---------- médico do plantão (escala clínica) ----------
// weekday: 0=domingo ... 6=sábado (igual Date.getDay())
const SCHEDULE_BY_WEEKDAY = {
  1: [ // segunda
    { start:"06:30", end:"10:30", medico:"Dra. Gizelle" },
    { start:"11:00", end:"13:00", medico:"Dr. Luiz" },
    { start:"16:00", end:"17:00", medico:"Dra. Nadia" },
  ],
  2: [ // terça
    { start:"06:30", end:"10:30", medico:"Dra. Gizelle" },
    { start:"11:00", end:"13:00", medico:"Dra. Nadia" },
    { start:"14:30", end:"16:00", medico:"Dr. Luiz" },
  ],
  3: [ // quarta
    { start:"06:30", end:"10:30", medico:"Dra. Gizelle" },
    { start:"11:00", end:"13:00", medico:"Dr. Luiz" },
  ],
  4: [ // quinta
    { start:"06:30", end:"10:30", medico:"Dra. Louane" },
    { start:"11:00", end:"13:00", medico:"Dra. Nadia" },

  5: [ // sexta

    { start:"11:00", end:"13:00", medico:"Dra. Nadia" },
    { start:"13:30", end:"16:00", medico:"Dr. Guilherme" },
  ],
};
const WEEKDAY_FULL = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];

function timeToMin(hhmm){
  const [h,m] = hhmm.split(":").map(Number);
  return h*60+m;
}
function getMedicoForSlot(weekday, hhmm){
  const slots = SCHEDULE_BY_WEEKDAY[weekday];
  if(!slots || !hhmm) return null;
  const t = timeToMin(hhmm);
  const hit = slots.find(s => t >= timeToMin(s.start) && t < timeToMin(s.end));
  return hit ? hit.medico : null;
}
function getMedicoForDate(dateISO, hhmm){
  if(!hhmm) return null;
  const weekday = new Date(dateISO+"T12:00:00").getDay();
  return getMedicoForSlot(weekday, hhmm);
}
function todayISO(){
  const d = new Date();
  const off = d.getTimezoneOffset();
  return new Date(d.getTime() - off*60000).toISOString().slice(0,10);
}
function fmtWeekday(iso){
  const d = new Date(iso+"T12:00:00");
  const s = d.toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"});
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function shiftDate(iso,delta){
  const d = new Date(iso+"T12:00:00"); d.setDate(d.getDate()+delta);
  return d.toISOString().slice(0,10);
}
function shiftMonth(ym,delta){
  const [y,m] = ym.split("-").map(Number);
  const d = new Date(y, m-1+delta, 1);
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
}
function monthMatrix(ym){
  const [y,m] = ym.split("-").map(Number);
  const first = new Date(y,m-1,1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(y,m,0).getDate();
  const cells = [];
  for(let i=0;i<startOffset;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(`${y}-${pad2(m)}-${pad2(d)}`);
  while(cells.length%7!==0) cells.push(null);
  return cells;
}
function miniMonthMatrix(year, monthIndex0){
  const first = new Date(year, monthIndex0, 1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(year, monthIndex0+1, 0).getDate();
  const cells = [];
  for(let i=0;i<startOffset;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(`${year}-${pad2(monthIndex0+1)}-${pad2(d)}`);
  return cells;
}

// ---------- voice dictation (Web Speech API + rule-based parsing) ----------
const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
const MIC_SUPPORTED = !!SpeechRecognitionCtor;
let recognition = null;

function stripAccents(s){
  return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
}

const EXAM_SYNONYMS = {
  CLINICO: ["clinico"],
  AUDIO: ["audio","audiometria"],
  EEG: ["eeg","eletroencefalograma"],
  ECG: ["ecg","eletrocardiograma"],
  ACV: ["acv","acuidade visual"],
  ESP: ["esp","espirometria"],
  ISHI: ["ishi","ishihara"],
  RX: ["rx","raio x","raio-x","raiox"],
  LAB: ["lab","laboratorial","laboratorio"],
  PSICO: ["psico","psicotecnico"],
  CINESIO: ["cinesio","cinesioteste","cinesiologico"],
  ODONTO: ["odonto","odontologico","dental"],
  TOXIC: ["toxic","toxicologico"],
  OTOLOGICO: ["otologico","otologia"],
  VOCAL: ["triagem vocal","vocal","fonoaudiologia"]
};

const TIME_WORDS = { "meio dia":"12:00", "meio-dia":"12:00", "meia noite":"00:00", "meia-noite":"00:00" };

function extractHorario(norm){
  for(const [word,val] of Object.entries(TIME_WORDS)){
    if(norm.includes(word)) return roundToHalfHour(val);
  }
  const m = norm.match(/(\d{1,2})\s*(?:h|:|horas?)\s*(\d{1,2})?/);
  if(m){
    let hh = Math.min(23, parseInt(m[1],10));
    let mm = m[2] ? Math.min(59, parseInt(m[2],10)) : 0;
    return roundToHalfHour(`${pad2(hh)}:${pad2(mm)}`);
  }
  return null;
}

function extractMarkedSegment(norm, raw, markers){
  // finds text after any marker keyword, up to the next marker keyword or end
  const allMarkers = ["horario","hora","empresa","funcionario","funcionaria","paciente","tipo","exame","exames"];
  for(const marker of markers){
    const idx = norm.indexOf(marker);
    if(idx===-1) continue;
    const afterStart = idx + marker.length;
    let end = raw.length;
    for(const other of allMarkers){
      if(other===marker) continue;
      const oIdx = norm.indexOf(other, afterStart);
      if(oIdx!==-1 && oIdx < end) end = oIdx;
    }
    const seg = raw.slice(afterStart, end).trim().replace(/^[:,-]\s*/,"");
    if(seg) return seg;
  }
  return null;
}

function parseVoiceCommand(rawText){
  const norm = stripAccents(rawText);
  const fields = [];
  const result = { horario:null, empresa:null, funcionario:null, tipo:null, exams:{} };

  const horario = extractHorario(norm);
  if(horario){ result.horario = horario; fields.push("horário "+horario); }

  const empresa = extractMarkedSegment(norm, rawText, ["empresa"]);
  if(empresa){ result.empresa = empresa; fields.push("empresa: "+empresa); }

  const funcionario = extractMarkedSegment(norm, rawText, ["funcionario","funcionaria","paciente"]);
  if(funcionario){ result.funcionario = funcionario; fields.push("funcionário: "+funcionario); }

  for(const tipo of TIPOS_SUGERIDOS){
    if(norm.includes(stripAccents(tipo))){ result.tipo = tipo; fields.push("tipo: "+tipo); break; }
  }

  const foundExams = [];
  for(const [code, syns] of Object.entries(EXAM_SYNONYMS)){
    if(syns.some(s=>norm.includes(s))){ result.exams[code]=true; foundExams.push(code); }
  }
  if(foundExams.length) fields.push("exames: "+foundExams.join(", "));

  return { result, fields };
}

function pushMessage(msg){
  state.chatMessages = [...state.chatMessages, msg];
  render();
  const body = document.querySelector(".chat-body");
  if(body) body.scrollTop = body.scrollHeight;
}

function speak(text){
  if(!state.speechEnabled) return;
  if(!("speechSynthesis" in window)) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "pt-BR";
    u.rate = 1;
    window.speechSynthesis.speak(u);
  } catch(_){}
}

function buildSpokenSummary(result, medico){
  const parts = [];
  if(result.empresa) parts.push(`empresa ${result.empresa}`);
  if(result.funcionario) parts.push(`funcionário ${result.funcionario}`);
  if(result.tipo) parts.push(`tipo ${result.tipo}`);
  if(result.horario) parts.push(`às ${result.horario}`);
  const exams = result.exames || Object.keys(result.exams||{});
  if(exams && exams.length) parts.push(`exames ${exams.join(", ")}`);
  if(medico) parts.push(`médico ${medico}`);
  return parts.join(", ");
}

function confirmAppointment(){
  if(!state.pendingAppointment) return;
  const p = state.pendingAppointment;
  const cleanExams = {};
  Object.keys(p.exams||{}).forEach(k=>{ if(p.exams[k]) cleanExams[k]=1; });
  const medico = cleanExams.CLINICO ? getMedicoForDate(state.date, p.horario) : null;
  const entry = { id: uid(), horario:p.horario, empresa:p.empresa, tipo:p.tipo, funcionario:p.funcionario, exams: cleanExams, medico };
  const next = [...state.entries, entry];
  saveEntries(state.date, next);
  state.entries = next;
  state.pendingAppointment = null;
  state.awaitingConfirmation = false;
  pushMessage({ role:"assistant", text: medico ? `✅ Agendamento adicionado com ${medico}!` : "✅ Agendamento adicionado com sucesso!" });
  speak(medico ? `Agendamento confirmado com ${medico}.` : "Agendamento confirmado e adicionado.");
}

function cancelPendingAppointment(){
  state.pendingAppointment = null;
  state.awaitingConfirmation = false;
  pushMessage({ role:"assistant", text:"Ok, não adicionei esse agendamento." });
  speak("Tudo bem, cancelado.");
}

function applyParsedResult(result, fields, source){
  const exams = result.exames || Object.keys(result.exams||{});
  const prefix = source==="ai" ? "🤖 " : "🔤 ";

  if(!fields.length){
    pushMessage({ role:"assistant", text: prefix+'Não consegui identificar nenhum campo. Tente algo como: "horário 8 horas, empresa Paraty, tipo periódico, exames clínico".' });
    speak("Não entendi. Pode repetir dizendo o horário e a empresa?");
    return;
  }

  const canConfirm = !!result.horario && (!!result.empresa || !!result.funcionario);
  const medico = (result.horario && exams.includes("CLINICO")) ? getMedicoForDate(state.date, result.horario) : null;
  const displayFields = medico ? [...fields, "médico: "+medico] : fields;

  if(canConfirm){
    state.pendingAppointment = {
      horario: result.horario, empresa: result.empresa||"", funcionario: result.funcionario||"",
      tipo: result.tipo||"", exams: Object.fromEntries(exams.map(k=>[k,true]))
    };
    state.awaitingConfirmation = true;
    const summary = buildSpokenSummary(result, medico);
    pushMessage({ role:"assistant", text: prefix+"Entendi: "+summary+". Confirma o agendamento?", fields: displayFields, confirm:true });
    speak(`Você quer agendar ${summary}. Confirma?`);
  } else {
    if(result.horario) state.form.horario = result.horario;
    if(result.empresa) state.form.empresa = result.empresa;
    if(result.funcionario) state.form.funcionario = result.funcionario;
    if(result.tipo) state.form.tipo = result.tipo;
    exams.forEach(k=>{ if(EXAMS.includes(k)) state.form.exams[k]=true; });
    if(state.viewMode!=="day") state.viewMode = "day";
    pushMessage({ role:"assistant", text: prefix+"Preenchi o que entendi no formulário — falta horário ou empresa/funcionário para eu confirmar direto. Complete e clique em Adicionar.", fields: displayFields });
    speak("Preenchi o formulário, mas falta horário ou empresa. Confira e adicione manualmente.");
  }
}

async function interpretWithAI(rawText){
  state.aiThinking = true;
  render();
  try {
    const system = `Você extrai dados de agendamentos de exames ocupacionais ditados por voz em português do Brasil.
Responda APENAS com um JSON válido, sem markdown, sem explicações, no formato exato:
{"horario": "HH:MM" ou null, "empresa": string ou null, "funcionario": string ou null, "tipo": um destes valores exatamente ou null [${TIPOS_SUGERIDOS.map(t=>`"${t}"`).join(", ")}], "exames": array com zero ou mais destes códigos exatamente [${EXAMS.map(e=>`"${e}"`).join(", ")}]}
Interprete sinônimos (ex: "audiometria" = AUDIO, "raio-x" = RX, "eletro" = ECG). Se a pessoa se corrigir ("não, na verdade..."), use a versão corrigida. Se algo não for mencionado, use null ou array vazio.`;

    let resp;
    try {
      resp = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "content-type": "application/json",
          "x-api-key": state.apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify({
          model: "claude-haiku-4-5-20251001",
          max_tokens: 300,
          system,
          messages: [{ role: "user", content: rawText }]
        })
      });
    } catch (networkErr) {
      throw new Error("Falha de rede ao chamar a IA — se você abriu este arquivo com duplo-clique (file://), o navegador pode estar bloqueando a chamada por segurança (CORS). Tente hospedar o arquivo (ex: servidor local) em vez de abrir direto do disco.");
    }
    if(!resp.ok){
      const errBody = await resp.json().catch(()=>({}));
      const msg = errBody?.error?.message || `Erro ${resp.status} na API`;
      throw new Error(resp.status===401 ? "Chave de API inválida ou expirada." : msg);
    }
    const data = await resp.json();
    const textOut = (data.content||[]).map(b=>b.text||"").join("").trim();
    const clean = textOut.replace(/```json|```/g,"").trim();
    const parsed = JSON.parse(clean);
    if(parsed.horario) parsed.horario = roundToHalfHour(parsed.horario);
    const fields = [];
    if(parsed.horario) fields.push("horário "+parsed.horario);
    if(parsed.empresa) fields.push("empresa: "+parsed.empresa);
    if(parsed.funcionario) fields.push("funcionário: "+parsed.funcionario);
    if(parsed.tipo) fields.push("tipo: "+parsed.tipo);
    if(parsed.exames && parsed.exames.length) fields.push("exames: "+parsed.exames.join(", "));
    applyParsedResult(parsed, fields, "ai");
  } catch(err){
    pushMessage({ role:"error", text:"⚠️ IA indisponível: " + err.message + " Usando reconhecimento por palavras-chave como reserva." });
    const { result, fields } = parseVoiceCommand(rawText);
    applyParsedResult({...result, exames: Object.keys(result.exams)}, fields, "rules");
  } finally {
    state.aiThinking = false;
    render();
  }
}

function handleTranscript(rawText){
  pushMessage({ role:"user", text: rawText });

  if(state.awaitingConfirmation){
    const norm = stripAccents(rawText);
    const yes = /\b(sim|confirma|confirmar|pode|isso mesmo|correto|positivo|exato)\b/.test(norm);
    const no = /\b(nao|cancela|cancelar|errado|negativo|espera)\b/.test(norm);
    if(yes){ confirmAppointment(); return; }
    if(no){ cancelPendingAppointment(); return; }
    pushMessage({ role:"assistant", text:'Não entendi — diga "sim" para confirmar ou "não" para cancelar.' });
    speak("Não entendi. Diga sim para confirmar, ou não para cancelar.");
    return;
  }

  if(state.apiKey){
    interpretWithAI(rawText);
  } else {
    const { result, fields } = parseVoiceCommand(rawText);
    applyParsedResult({...result, exames: Object.keys(result.exams)}, fields, "rules");
  }
}

function startListening(){
  if(!MIC_SUPPORTED){
    pushMessage({ role:"error", text:"Seu navegador não tem suporte a ditado por voz. Funciona no Chrome ou Edge." });
    return;
  }
  if(location.protocol === "file:"){
    pushMessage({ role:"error", text:"⚠️ Este arquivo foi aberto direto do disco (file://). Alguns navegadores bloqueiam o microfone nesse modo. Se não funcionar, tente hospedar o arquivo em um servidor local ou abrir via https://." });
  }
  if(!recognition){
    recognition = new SpeechRecognitionCtor();
    recognition.lang = "pt-BR";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognition.onstart = ()=>{ state.listening = true; state.micStartConfirmed = true; render(); };
    recognition.onresult = (e)=>{
      const text = e.results[0][0]?.transcript || "";
      if(text.trim()) handleTranscript(text);
    };
    recognition.onerror = (e)=>{
      const messages = {
        "not-allowed": "Permissão de microfone negada. Clique no ícone de cadeado/microfone na barra de endereço e permita o acesso.",
        "service-not-allowed": "O serviço de reconhecimento de voz foi bloqueado pelo navegador.",
        "network": "Falha de rede no reconhecimento de voz. Isso é comum ao abrir o arquivo direto do disco (file://) — o serviço de voz do navegador exige conexão a um servidor. Tente acessar via https:// ou um servidor local.",
        "no-speech": "Não ouvi nada. Toque no microfone e fale novamente.",
        "audio-capture": "Nenhum microfone encontrado no dispositivo.",
        "aborted": null
      };
      const msg = messages[e.error];
      if(msg) pushMessage({ role:"error", text: "⚠️ " + msg });
      state.listening = false;
      render();
    };
    recognition.onend = ()=>{ state.listening = false; render(); };
  }
  try {
    recognition.start();
    state.listening = true;
    render();
  } catch(err){
    // most common cause: recognition already running from a previous click
    try { recognition.stop(); } catch(_){}
    state.listening = false;
    pushMessage({ role:"error", text:"⚠️ Não consegui iniciar o microfone (" + err.message + "). Toque novamente." });
    render();
  }
}

function stopListening(){
  if(recognition){ try { recognition.stop(); } catch(_){} }
  state.listening = false;
  render();
}

function renderVoiceWidget(){
  const host = document.getElementById("voice-widget");
  host.innerHTML = "";

  if(state.widgetOpen){
    const panel = el(`<div class="chat-panel"></div>`);
    const head = el(`<div class="chat-head">
      <div class="title">🎙️ Assistente de voz</div>
      <div class="status">${state.listening?'ouvindo…':(state.aiThinking?'pensando…':(state.apiKey?'IA ativada':'modo palavras-chave'))}</div>
    </div>`);
    const btns = el(`<div class="chat-head-btns"></div>`);
    const muteBtn = el(`<button title="${state.speechEnabled?'Silenciar respostas':'Ativar respostas por áudio'}">${state.speechEnabled?'🔊':'🔇'}</button>`);
    muteBtn.onclick = ()=>{ state.speechEnabled = !state.speechEnabled; if(!state.speechEnabled) window.speechSynthesis?.cancel(); render(); };
    const gearBtn = el(`<button title="Configurar IA">⚙️</button>`);
    gearBtn.onclick = ()=> setState({ showAiPanel: !state.showAiPanel });

    btns.append(muteBtn, gearBtn, closeBtn);
    head.appendChild(btns);
    panel.appendChild(head);

    if(state.showAiPanel){
      const aip = el(`<div class="ai-panel" style="margin:10px 12px 0;"></div>`);
      aip.innerHTML = `
        <p>Com uma chave de API da Anthropic, o áudio é interpretado por IA de verdade. A chave fica salva só neste navegador e é usada apenas para chamar <b>api.anthropic.com</b> diretamente. Crie a sua em <a href="https://console.anthropic.com/settings/keys" target="_blank">console.anthropic.com</a> (cobrança por uso, centavos por comando). Sem chave, funciona por palavras-chave.</p>
        <div class="ai-key-row">
          <input type="password" id="api-key-input" placeholder="Cole sua chave de API aqui" value="${esc(state.apiKeyDraft)}">
          <button class="ai-save">Salvar</button>
          ${state.apiKey ? `<button class="ai-remove">Remover</button>` : ""}
        </div>
        <p class="ai-status ${state.apiKey?'on':'off'}">${state.apiKey?'✅ IA ativada':'○ Nenhuma chave configurada'}</p>
      `;
      aip.querySelector("#api-key-input").oninput = e=>{ state.apiKeyDraft = e.target.value; };
      aip.querySelector(".ai-save").onclick = saveApiKey;
      const rm = aip.querySelector(".ai-remove");
      if(rm) rm.onclick = removeApiKey;
      panel.appendChild(aip);
    }

    const body = el(`<div class="chat-body"></div>`);
    if(state.chatMessages.length===0){
      body.appendChild(el(`<div class="chat-empty">Toque no microfone e fale, ex.:<br>"horário 8 horas, empresa Paraty, tipo periódico, exames clínico e audiometria"</div>`));
    } else {
      state.chatMessages.forEach((msg,idx)=>{
        if(msg.role==="user"){
          const row = el(`<div class="bubble-row user"><div class="bubble user">🗣️ “${esc(msg.text)}”</div></div>`);
          body.appendChild(row);
        } else if(msg.role==="error"){
          const row = el(`<div class="bubble-row assistant"><div class="bubble error">${esc(msg.text)}</div></div>`);
          body.appendChild(row);
        } else {
          const b = el(`<div class="bubble assistant">${esc(msg.text)}</div>`);
          if(msg.fields && msg.fields.length){
            const fw = el(`<div class="fields"></div>`);
            msg.fields.forEach(f=> fw.appendChild(el(`<span class="chip">${esc(f)}</span>`)));
            b.appendChild(fw);
          }
          const isLast = idx === state.chatMessages.length-1;
          if(msg.confirm && isLast && state.awaitingConfirmation){
            const actions = el(`<div style="display:flex;gap:6px;margin-top:8px;"></div>`);
            const okBtn = el(`<button style="flex:1;border:none;border-radius:7px;padding:7px;font-size:12px;font-weight:700;cursor:pointer;background:var(--good-fg);color:#fff;">✅ Confirmar</button>`);
            okBtn.onclick = confirmAppointment;
            const noBtn = el(`<button style="flex:1;border:none;border-radius:7px;padding:7px;font-size:12px;font-weight:700;cursor:pointer;background:#FEE2E2;color:#DC2626;">✖️ Cancelar</button>`);
            noBtn.onclick = cancelPendingAppointment;
            actions.append(okBtn,noBtn);
            b.appendChild(actions);
          }
          const row = el(`<div class="bubble-row assistant"></div>`);
          row.appendChild(b);
          body.appendChild(row);
        }
      });
    }
    if(state.aiThinking){
      const row = el(`<div class="bubble-row assistant"><div class="bubble assistant"><span class="thinking-dots"><span></span><span></span><span></span></span></div></div>`);
      body.appendChild(row);
    }
    panel.appendChild(body);

    const foot = el(`<div class="chat-foot"></div>`);
    const talkBtn = el(`<button type="button" class="talk-btn ${state.listening?'listening':''}" ${state.aiThinking?'disabled':''}>
      ${state.listening?'⏺️ Ouvindo… toque para parar':'🎙️ Toque e fale'}
    </button>`);
    talkBtn.onclick = ()=> state.listening ? stopListening() : startListening();
    foot.appendChild(talkBtn);
    foot.appendChild(el(`<p class="chat-foot-hint">Funciona melhor no Chrome/Edge, com internet.</p>`));
    panel.appendChild(foot);

    host.appendChild(panel);

    // auto-scroll to bottom
    requestAnimationFrame(()=>{ const b=host.querySelector(".chat-body"); if(b) b.scrollTop = b.scrollHeight; });
  }

  const fab = el(`<button class="fab ${state.listening?'listening':''} ${state.aiThinking?'thinking':''}" title="Assistente de voz">
    ${state.listening?'⏺️':(state.aiThinking?'🤖':'🎙️')}
  </button>`);
  fab.onclick = toggleWidget;
  if(state.apiKey) fab.appendChild(el(`<span class="fab-dot" title="IA ativada"></span>`));
  host.appendChild(fab);
}

// ---------- render helpers ----------
function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstChild; }
function esc(s){ return (s??"").toString().replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

function renderTabs(){
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  [["day","Dia"],["month","Mês"],["year","Ano"]].forEach(([id,label])=>{
    const b = el(`<button class="tab ${state.viewMode===id?'active':''}">${label}</button>`);
    b.onclick = ()=>{
      if(id==="month") state.monthCursor = state.date.slice(0,7);
      if(id==="year") state.yearCursor = Number(state.date.slice(0,4));
      setState({ viewMode:id });
    };
    tabs.appendChild(b);
  });
}

function renderNav(){
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  if(state.viewMode==="day"){
    const prev = el(`<button class="btn-ghost">‹</button>`); prev.onclick=()=>changeDate(shiftDate(state.date,-1));
    const box = el(`<div class="datebox">📅 <input type="date" value="${state.date}"></div>`);
    box.querySelector("input").onchange = (e)=>changeDate(e.target.value);
    const next = el(`<button class="btn-ghost">›</button>`); next.onclick=()=>changeDate(shiftDate(state.date,1));
    const today = el(`<button class="btn-ghost mono" style="font-size:12px;font-weight:700;">Hoje</button>`);
    today.onclick = ()=>changeDate(todayISO());
    const wk = el(`<span style="font-size:14px;color:rgba(255,255,255,.9);margin-left:4px;">${fmtWeekday(state.date)}</span>`);
    nav.append(prev, box, next, today, wk);
  } else if(state.viewMode==="month"){
    const prev = el(`<button class="btn-ghost">‹</button>`); prev.onclick=()=>setState({monthCursor:shiftMonth(state.monthCursor,-1)});
    const label = el(`<span class="mono" style="font-weight:800;min-width:160px;font-size:14px;">${MONTH_LABELS[Number(state.monthCursor.slice(5,7))-1]} ${state.monthCursor.slice(0,4)}</span>`);
    const next = el(`<button class="btn-ghost">›</button>`); next.onclick=()=>setState({monthCursor:shiftMonth(state.monthCursor,1)});
    const today = el(`<button class="btn-ghost mono" style="font-size:12px;font-weight:700;">Mês atual</button>`);
    today.onclick = ()=>setState({monthCursor: todayISO().slice(0,7)});
    const total = Object.entries(state.index).filter(([d])=>d.startsWith(state.monthCursor)).reduce((s,[,c])=>s+c,0);
    const info = el(`<span class="mono" style="color:rgba(255,255,255,.8);font-size:13px;">${total} agendamento${total!==1?"s":""} no mês</span>`);
    nav.append(prev,label,next,today,info);
  } else {
    const prev = el(`<button class="btn-ghost">‹</button>`); prev.onclick=()=>setState({yearCursor:state.yearCursor-1});
    const label = el(`<span class="mono" style="font-weight:800;min-width:70px;font-size:14px;">${state.yearCursor}</span>`);
    const next = el(`<button class="btn-ghost">›</button>`); next.onclick=()=>setState({yearCursor:state.yearCursor+1});
    const today = el(`<button class="btn-ghost mono" style="font-size:12px;font-weight:700;">Ano atual</button>`);
    today.onclick = ()=>setState({yearCursor: Number(todayISO().slice(0,4))});
    const total = Object.entries(state.index).filter(([d])=>d.startsWith(String(state.yearCursor))).reduce((s,[,c])=>s+c,0);
    const info = el(`<span class="mono" style="color:rgba(255,255,255,.8);font-size:13px;">${total} agendamento${total!==1?"s":""} no ano</span>`);
    nav.append(prev,label,next,today,info);
  }
}

function computeTotals(entries){
  const t = emptyExams(); EXAMS.forEach(k=>t[k]=0);
  entries.forEach(e=>{ EXAMS.forEach(k=>{ const v=e.exams?.[k]; if(v) t[k]+=Number(v); }); });
  return t;
}

function renderDayView(){
  const container = el(`<div class="grid5"></div>`);
  const left = el(`<div></div>`);

    btn.onclick = ()=>toggleExam(k);
    eg.appendChild(btn);
  });
  examBlock.appendChild(eg);
  form.appendChild(examBlock);

  if(state.form.exams["CLINICO"]){
    let hintHtml, hintClass;
    if(!state.form.horario){
      hintHtml = "🩺 Informe o horário para eu identificar o médico responsável.";
      hintClass = "medico-hint pending";
    } else {
      const medico = getMedicoForDate(state.date, state.form.horario);
      if(medico){
        hintHtml = `🩺 Médico responsável: <b>${esc(medico)}</b>`;
        hintClass = "medico-hint ok";
      } else {
        hintHtml = `⚠️ Nenhum médico escalado para ${esc(state.form.horario)} nesta ${esc(WEEKDAY_FULL[new Date(state.date+"T12:00:00").getDay()])}.`;
        hintClass = "medico-hint warn";
      }
    }
    form.appendChild(el(`<div class="${hintClass}">${hintHtml}</div>`));
  }

  if(state.formError){
    form.appendChild(el(`<div class="err">⚠️ ${esc(state.formError)}</div>`));
  }
  const submitBtn = el(`<button type="submit" class="submit-btn">${state.editingId?"✓ Salvar alterações":"+ Adicionar agendamento"}</button>`);
  form.appendChild(submitBtn);
  form.onsubmit = submitForm;
  left.appendChild(form);

  // table card
  const tableCard = el(`<div class="card" style="padding:0;overflow:hidden;"></div>`);
  const th = el(`<div style="padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;">
    <h2 style="margin:0;">Agendamentos do dia</h2>
    <span class="mono" style="font-size:12px;color:#9CA3AF;">${state.entries.length} entrada${state.entries.length!==1?"s":""}</span>
  </div>`);
  tableCard.appendChild(th);

  const sorted = [...state.entries].sort((a,b)=>{
    if(!a.horario) return 1; if(!b.horario) return -1;
    return a.horario.localeCompare(b.horario);
  });

  if(state.error){
    tableCard.appendChild(el(`<div class="empty" style="color:var(--amber-fg);">⚠️ ${esc(state.error)}</div>`));
  } else if(sorted.length===0){
    tableCard.appendChild(el(`<div class="empty">Nenhum agendamento para ${esc(fmtWeekday(state.date).toLowerCase())}. Use o formulário acima para adicionar.</div>`));
  } else {
    const wrap = el(`<div style="overflow-x:auto;"></div>`);
    const table = el(`<table>
      <thead><tr><th>Hora</th><th>Empresa</th><th>Tipo</th><th>Funcionário(a)</th><th>Exames</th><th></th></tr></thead>
      <tbody></tbody>
    </table>`);
    const tbody = table.querySelector("tbody");
    sorted.forEach((entry,i)=>{
      const tr = el(`<tr style="background:${i%2?'#FBFAF7':'white'};"></tr>`);
      tr.appendChild(el(`<td class="mono" style="font-weight:700;color:var(--navy);">${esc(entry.horario)||"—"}${entry.medico?`<div style="font-family:'Inter',sans-serif;font-weight:600;font-size:10.5px;color:var(--good-fg);margin-top:2px;">🩺 ${esc(entry.medico)}</div>`:""}</td>`));
      tr.appendChild(el(`<td>${esc(entry.empresa)||"—"}</td>`));
      tr.appendChild(el(`<td style="color:#6B7280;">${esc(entry.tipo)||"—"}</td>`));
      tr.appendChild(el(`<td>${esc(entry.funcionario)||"—"}</td>`));
      const examsTd = el(`<td></td>`);
      const marked = EXAMS.filter(k=>entry.exams?.[k]);
      if(marked.length===0){ examsTd.innerHTML = `<span style="color:#D1D5DB;font-size:12px;">—</span>`; }
      else { marked.forEach(k=> examsTd.appendChild(el(`<span class="chip">${k}</span>`))); }
      tr.appendChild(examsTd);
      const actionsTd = el(`<td></td>`);
      const actionsRow = el(`<div style="display:flex;gap:4px;justify-content:flex-end;"></div>`);
      const editBtn = el(`<button class="icon-btn">✏️</button>`); editBtn.onclick=()=>startEdit(entry);
      actionsRow.appendChild(editBtn);

        const conf = el(`<button class="mono" style="font-size:11px;font-weight:700;padding:5px 8px;border:none;border-radius:6px;background:#FEE2E2;color:#DC2626;cursor:pointer;">confirmar</button>`);
        conf.onclick=()=>deleteEntry(entry.id);
        const cancelDel = el(`<button class="icon-btn">✕</button>`); cancelDel.onclick=()=>setState({confirmDeleteId:null});
        actionsRow.append(conf,cancelDel);
      } else {
        const delBtn = el(`<button class="icon-btn">🗑️</button>`); delBtn.onclick=()=>setState({confirmDeleteId:entry.id});

      }
      actionsTd.appendChild(actionsRow);
      tr.appendChild(actionsTd);
      tbody.appendChild(tr);
    });
    wrap.appendChild(table);
    tableCard.appendChild(wrap);
  }
  left.appendChild(tableCard);

  // summary
  const summaryCard = el(`<div class="card"></div>`);

    <div class="stat"><p class="label">Agendamentos</p><p class="value" style="color:var(--navy);">${state.entries.length}</p></div>

  summaryCard.appendChild(stats);

  const chartData = EXAMS.map(k=>({name:k,total:totals[k]})).filter(d=>d.total>0);
  if(chartData.length===0){
    summaryCard.appendChild(el(`<p style="text-align:center;color:#9CA3AF;font-size:14px;padding:32px 0;">Sem exames marcados ainda.</p>`));
  } else {
    const max = Math.max(...chartData.map(d=>d.total));
    const chart = el(`<div></div>`);
    chartData.forEach(d=>{
      const pct = Math.max(6, Math.round((d.total/max)*100));
      chart.appendChild(el(`<div class="bar-row">
        <span class="bar-label">${d.name}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;"></div></div>

    summaryCard.appendChild(chart);
  }
  right.appendChild(summaryCard);

  const weekday = new Date(state.date+"T12:00:00").getDay();

      list.appendChild(el(`<div style="background:var(--paper);border-radius:8px;padding:8px 10px;">

  const tips = el(`<div class="tips">
    <p class="k">como funciona</p>
    <ul>
      <li>• Digite o horário — o sistema ordena tudo automaticamente.</li>
      <li>• Use as abas Mês/Ano para ver a agenda inteira de uma vez.</li>
      <li>• Ao marcar CLÍNICO, o médico responsável é identificado sozinho.</li>
      <li>• Cada dado fica salvo neste navegador (localStorage).</li>
    </ul>
  </div>`);
  right.appendChild(tips);

  container.append(left,right);
  return container;
}

function renderMonthView(){
  const card = el(`<div class="card"></div>`);
  const wkRow = el(`<div class="month-grid" style="margin-bottom:2px;"></div>`);
  WEEKDAY_LABELS.forEach(w=> wkRow.appendChild(el(`<div class="wk-lbl">${w}</div>`)));
  card.appendChild(wkRow);
  const grid = el(`<div class="month-grid"></div>`);
  const todayStr = todayISO();
  monthMatrix(state.monthCursor).forEach(iso=>{
    if(!iso){ grid.appendChild(el(`<div></div>`)); return; }
    const count = state.index[iso]||0;
    const isToday = iso===todayStr;
    const dayNum = Number(iso.slice(8,10));
    const cell = el(`<button class="day-cell ${count>0?'has':''} ${isToday?'today':''}">
      <span class="day-num">${dayNum}</span>
      ${count>0?`<span class="day-badge">${count}</span>`:""}
    </button>`);
    cell.onclick = ()=>goToDay(iso);
    grid.appendChild(cell);
  });
  card.appendChild(grid);
  return card;
}

function renderYearView(){
  const grid = el(`<div class="year-grid"></div>`);
  MONTH_LABELS.forEach((label, mIdx)=>{
    const ym = `${state.yearCursor}-${pad2(mIdx+1)}`;
    const total = Object.entries(state.index).filter(([d])=>d.startsWith(ym)).reduce((s,[,c])=>s+c,0);
    const card = el(`<button class="month-card"></button>`);
    const top = el(`<div class="month-card-top">
      <span class="name">${label}</span>
      ${total>0?`<span class="mono" style="font-size:10px;font-weight:800;background:var(--good-bg);color:var(--good-fg);padding:2px 6px;border-radius:6px;">${total}</span>`:""}
    </div>`);
    card.appendChild(top);
    const mini = el(`<div class="mini-grid"></div>`);
    miniMonthMatrix(state.yearCursor, mIdx).forEach(iso=>{
      const has = iso && state.index[iso];
      const c = el(`<div class="mini-cell" style="background:${iso?(has?'var(--teal)':'var(--line)'):'transparent'};opacity:${iso?(has?1:0.35):0};"></div>`);
      mini.appendChild(c);
    });
    card.appendChild(mini);
    card.onclick = ()=>openMonth(ym);
    grid.appendChild(card);
  });
  return grid;
}

function render(){
  renderTabs();
  renderNav();
  const main = document.getElementById("main");
  main.innerHTML = "";
  const wrap = el(`<div class="wrap" style="padding-top:0;"></div>`);
  if(state.viewMode==="day") wrap.appendChild(renderDayView());
  else if(state.viewMode==="month") wrap.appendChild(renderMonthView());
  else wrap.appendChild(renderYearView());
  main.appendChild(wrap);
  renderVoiceWidget();
}
