<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitar Agendamento - Alpale Saúde Ocupacional</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <style>
    :root {
      --primary: #1E3A5F;
      --secondary: #008CB4;
      --bg-light: #F4F7FA;
      --border-color: #CBD5E1;
      --white: #FFFFFF;
      --success: #2EC4B6;
      --danger: #EF4444;
      --warning: #F59E0B;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background-color: var(--bg-light); color: var(--primary); min-height: 100vh; }

    /* FAIXA AZUL COM O LOGO GRANDE ALINHADO À DIREITA */
    .blue-band {
      background: var(--primary);
      color: var(--white);
      padding: 3.5rem 5% 8.5rem 5%;
    }
    .band-content {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 2rem;
    }
    .band-text p { font-size: 0.95rem; color: #CBD5E1; margin-bottom: 0.2rem; }
    .band-text h1 { font-size: 2.4rem; font-weight: 700; }

    .logo-img-large {
      height: 130px;
      max-width: 350px;
      object-fit: contain;
      background: var(--white);
      padding: 15px 25px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    .main-container {
      margin-top: -5.5rem;
      padding: 0 5% 3rem 5%;
      display: flex;
      justify-content: center;
      position: relative;
      z-index: 10;
    }

    /* CARD EXPANDIDO NA HORIZONTAL */
    .form-card {
      background: var(--white);
      width: 100%;
      max-width: 1100px; 
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
      padding: 3rem;
    }

    .card-title { font-size: 1.6rem; font-weight: 700; color: var(--primary); margin-bottom: 2rem; }

    /* GRID REFORMULADO */
    .form-grid { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 1.5rem; 
      margin-bottom: 2rem; 
    }
    
    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-card { padding: 1.8rem; }
      .band-content { flex-direction: column-reverse; text-align: center; }
      .blue-band { padding: 2.5rem 5% 6.5rem 5%; }
      .band-text h1 { font-size: 1.8rem; }
      .logo-img-large { height: 100px; }
    }

    /* INPUTS */
    .input-group { display: flex; flex-direction: column; }
    .input-group label { font-size: 0.85rem; font-weight: 600; color: var(--primary); margin-bottom: 0.5rem; }
    .input-wrapper { position: relative; }
    .input-wrapper i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #6C7A89; }
    .input-wrapper input, .input-wrapper select {
      width: 100%; padding: 0.9rem 1rem 0.9rem 2.6rem; border: 1.5px solid var(--border-color); border-radius: 12px; font-size: 0.95rem; color: #333; background: var(--white); transition: all 0.3s;
    }
    .input-wrapper input:focus, .input-wrapper select:focus { border-color: var(--secondary); outline: none; box-shadow: 0 0 0 3px rgba(0, 140, 180, 0.15); }
    
    .input-wrapper input[readonly] { background-color: #F8FAFC; color: #1E3A5F; font-weight: 700; cursor: not-allowed; }

    .date-info-badge {
      font-size: 0.8rem;
      margin-top: 6px;
      font-weight: 600;
      display: none;
    }

    /* CHIPS DOS EXAMES */
    .exams-title { font-size: 0.95rem; font-weight: 700; color: var(--primary); margin-bottom: 1rem; }
    .exams-grid { display: flex; flex-wrap: wrap; gap: 0.65rem; margin-bottom: 2rem; }
    .exam-chip {
      background: var(--white); border: 1.5px solid var(--border-color); padding: 0.65rem 1.25rem; border-radius: 50px; font-size: 0.85rem; font-weight: 600; color: var(--primary); cursor: pointer; user-select: none; transition: all 0.2s ease;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .exam-chip:hover { border-color: var(--secondary); background: rgba(0, 140, 180, 0.04); }
    .exam-chip.active { background: var(--primary); border-color: var(--primary); color: var(--white); }
    
    /* CHIP ESGOTADO */
    .exam-chip.esgotado {
      background-color: #F1F5F9 !important;
      border-color: #CBD5E1 !important;
      color: #94A3B8 !important;
      cursor: not-allowed !important;
      opacity: 0.65;
    }
    .badge-esgotado {
      font-size: 0.72rem;
      background: #E2E8F0;
      color: #64748B;
      padding: 2px 7px;
      border-radius: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .alert-banner { background: #E0F2FE; border-left: 4px solid var(--secondary); color: #0369A1; padding: 1rem; border-radius: 10px; font-size: 0.85rem; margin-bottom: 1.5rem; display: none; align-items: center; gap: 0.65rem; }

    /* UPLOAD */
    .upload-area { border: 2px dashed var(--border-color); background: var(--bg-light); border-radius: 16px; padding: 2rem; text-align: center; cursor: pointer; position: relative; margin-bottom: 2rem; transition: all 0.3s; }
    .upload-area:hover { border-color: var(--secondary); background: rgba(0, 140, 180, 0.03); }
    .upload-area input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    .upload-icon { font-size: 2.2rem; color: var(--secondary); margin-bottom: 0.5rem; }
    .upload-text { font-size: 0.9rem; font-weight: 600; color: var(--primary); }
    .file-preview { display: none; align-items: center; justify-content: center; gap: 0.5rem; font-size: 0.85rem; color: var(--success); font-weight: 600; margin-top: 0.5rem; }

    /* BOTÃO */
    .btn-submit { width: 100%; background: linear-gradient(135deg, #00B4D8 0%, var(--secondary) 100%); color: var(--white); border: none; padding: 1.25rem; border-radius: 50px; font-size: 1.05rem; font-weight: 600; cursor: pointer; box-shadow: 0 8px 20px rgba(0, 140, 180, 0.25); transition: all 0.3s ease; }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0, 140, 180, 0.35); }
    .btn-submit:disabled { background: #CBD5E1; cursor: not-allowed; box-shadow: none; transform: none; }
    .status-msg { text-align: center; margin-top: 1.25rem; font-size: 0.95rem; font-weight: 600; min-height: 24px; }
  </style>
</head>
<body>

  <!-- FAIXA AZUL COM LOGO -->
  <div class="blue-band">
    <div class="band-content">
      <div class="band-text">
        <p>Agendamento de Clientes</p>
        <h1>Solicitar Agendamento</h1>
      </div>
      <img src="logo.png" alt="Alpale Saúde Ocupacional" class="logo-img-large" onerror="this.src='ALPALE LOGO-01.jpg'">
    </div>
  </div>

  <main class="main-container">
    <div class="form-card">
      <h2 class="card-title">Agendar Exame Ocupacional</h2>

      <form id="agendamentoForm">
        <div class="form-grid">
          <div class="input-group">
            <label for="empresa">Buscar empresa *</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input type="text" id="empresa" placeholder="Nome da empresa solicitante" required>
            </div>
          </div>

          <div class="input-group">
            <label for="funcionario">Nome do colaborador *</label>
            <div class="input-wrapper">
              <i class="fa-regular fa-user"></i>
              <input type="text" id="funcionario" placeholder="Nome completo do colaborador" required>
            </div>
          </div>

          <div class="input-group">
            <label for="tipo">Tipo de Exame (ASO) *</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-notes-medical"></i>
              <select id="tipo" required>
                <option value="" disabled selected>Selecione o tipo do ASO...</option>
                <option value="Admissional">Admissional</option>
                <option value="Periódico">Periódico</option>
                <option value="Demissional">Demissional</option>
                <option value="Mudança de Função">Mudança de Função</option>
                <option value="Retorno">Retorno ao Trabalho</option>
              </select>
            </div>
          </div>

          <div class="input-group">
            <label for="data">Data pretendida *</label>
            <div class="input-wrapper">
              <i class="fa-regular fa-calendar"></i>
              <input type="date" id="data" required>
            </div>
            <div id="dateInfoBadge" class="date-info-badge"></div>
          </div>

          <!-- SELEÇÃO DE MÉDICO E HORÁRIO -->
          <div class="input-group" id="divMedico" style="display: none;">
            <label for="medico">Médico Disponível *</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-user-doctor"></i>
              <select id="medico" required>
                <option value="" disabled selected>Selecione a data primeiro...</option>
              </select>
            </div>
          </div>

          <div class="input-group" id="divHorario" style="display: none;">
            <label for="horario">Horário de Chegada *</label>
            <div class="input-wrapper">
              <i class="fa-regular fa-clock"></i>
              <input type="text" id="horario" value="" readonly required>
            </div>
          </div>
        </div>

        <h3 class="exams-title">Exames ocupacionais solicitados</h3>
        <div class="exams-grid" id="examsGrid"></div>

        <div class="alert-banner" id="psicoAlert">
          <i class="fa-solid fa-circle-info"></i>
          <span><strong>Atenção:</strong> Devido ao exame Psicossocial, o horário foi atualizado automaticamente para as <strong>06:30</strong>.</span>
        </div>

        <div class="input-group">
          <label style="margin-top: 1rem;">Anexar arquivos (Opcional)</label>
          <div class="upload-area" id="uploadArea">
            <input type="file" id="arquivoKit" accept=".pdf, .png, .jpg, .jpeg">
            <div class="upload-icon"><i class="fa-solid fa-paperclip"></i></div>
            <div class="upload-text" id="uploadText">Clique ou arraste a Guia / Kit de Atendimento (PDF, PNG, JPG)</div>
            <div class="file-preview" id="filePreview">
              <i class="fa-solid fa-circle-check"></i> <span id="fileName">arquivo.pdf</span>
            </div>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="btnSubmit">CONFIRMAR AGENDAMENTO</button>
        <div class="status-msg" id="statusMsg"></div>
      </form>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
    import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAL2xXqo83pWKhyCta4Nk0gockDstxtJY4",
      authDomain: "agendamento-alpale.firebaseapp.com",
      projectId: "agendamento-alpale",
      storageBucket: "agendamento-alpale.firebasestorage.app",
      messagingSenderId: "491340347533",
      appId: "1:491340347533:web:0983b4dba5bbdcc534cac4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    const form = document.getElementById('agendamentoForm');
    const examsGrid = document.getElementById('examsGrid');
    const dataInput = document.getElementById('data');
    const dateInfoBadge = document.getElementById('dateInfoBadge');
    const medicoSelect = document.getElementById('medico');
    const horarioInput = document.getElementById('horario');
    const divMedico = document.getElementById('divMedico');
    const divHorario = document.getElementById('divHorario');
    const arquivoInput = document.getElementById('arquivoKit');
    const uploadArea = document.getElementById('uploadArea');
    const uploadText = document.getElementById('uploadText');
    const filePreview = document.getElementById('filePreview');
    const fileNameSpan = document.getElementById('fileName');
    const btnSubmit = document.getElementById('btnSubmit');
    const statusMsg = document.getElementById('statusMsg');
    const alertBanner = document.getElementById('psicoAlert');

    // Bloquear datas no passado
    const hojeStr = new Date().toISOString().split('T')[0];
    dataInput.min = hojeStr;

    // Catálogo padrão sincronizado com index.html
    const catalogoPadrao = {
      CLINICO:       { ativo: true,  limiteDia: 35, nome: "Clínico" },
      AUDIO:         { ativo: true,  limiteDia: 25, nome: "Audiometria" },
      ACV:           { ativo: true,  limiteDia: 30, nome: "Acuidade Visual" },
      LAB:           { ativo: true,  limiteDia: 25, nome: "Laboratório (Sangue)" },
      RX:            { ativo: true,  limiteDia: 20, nome: "Raio-X" },
      PSICO:         { ativo: true,  limiteDia: 8,  nome: "Psicossocial" },
      ECG:           { ativo: true,  limiteDia: 15, nome: "ECG" },
      EEG:           { ativo: true,  limiteDia: 10, nome: "EEG" },
      ESP:           { ativo: true,  limiteDia: 20, nome: "Espirometria" },
      ISHI:          { ativo: true,  limiteDia: 30, nome: "Ishihara" },
      CINESIO:       { ativo: false, limiteDia: 10, nome: "Cinesiológico" },
      ODONTO:        { ativo: false, limiteDia: 10, nome: "Odontológico" },
      TOXIC:         { ativo: false, limiteDia: 10, nome: "Toxicológico" },
      OTOLOGICO:     { ativo: false, limiteDia: 15, nome: "Otológico" },
      VOCAL:         { ativo: false, limiteDia: 10, nome: "Avaliação Vocal" },
      "T. SONO":     { ativo: false, limiteDia: 15, nome: "Teste do Sono" },
      PERICIA:       { ativo: false, limiteDia: 5,  nome: "Perícia" },
      "PERICIA DOM": { ativo: false, limiteDia: 2,  nome: "Perícia Domiciliar" }
    };

    let regrasVagas = {
      limiteTotalDia: 35,
      datasBloqueadas: [],
      exames: JSON.parse(JSON.stringify(catalogoPadrao))
    };

    let agendamentosDoDiaAtual = [];

    // ESCALA MÉDICA FIXA
    const escalaSemanal = {
      1: [ // Segunda
        { nome: "Dra. Gizelle", horarioInicio: "08:30" },
        { nome: "Dr. Luiz", horarioInicio: "11:00" },
        { nome: "Dra. Nadia", horarioInicio: "16:00" }
      ],
      2: [ // Terça
        { nome: "Dra. Gizelle", horarioInicio: "08:30" },
        { nome: "Dra. Nadia", horarioInicio: "11:00" },
        { nome: "Dr. Luiz", horarioInicio: "14:30" }
      ],
      3: [ // Quarta
        { nome: "Dra. Gizelle", horarioInicio: "08:30" },
        { nome: "Dr. Luiz", horarioInicio: "11:00" }
      ],
      4: [ // Quinta
        { nome: "Dra. Louane", horarioInicio: "08:30" },
        { nome: "Dra. Nadia", horarioInicio: "11:00" },
        { nome: "Dra. Gizelle", horarioInicio: "13:30" }
      ],
      5: [ // Sexta
        { nome: "Dra. Louane", horarioInicio: "08:30" },
        { nome: "Dra. Nadia", horarioInicio: "11:00" },
        { nome: "Dr. Guilherme", horarioInicio: "13:30" }
      ]
    };

    function atualizarHorario() {
      const chipPsico = document.querySelector('.exam-chip[data-exam="PSICO"]');
      const isPsico = chipPsico && chipPsico.classList.contains('active');

      if (isPsico) {
        horarioInput.value = "06:30";
      } else {
        if (medicoSelect.selectedIndex > 0) {
          const opcaoSelecionada = medicoSelect.options[medicoSelect.selectedIndex];
          horarioInput.value = opcaoSelecionada.dataset.horario;
        } else {
          horarioInput.value = "";
        }
      }
    }

    // Carregar configurações de limites do Firebase (salvas pelo index.html)
    async function carregarRegrasVagas() {
      try {
        const snap = await getDoc(doc(db, "configuracoes", "limites_agendamento"));
        if (snap.exists()) {
          const dados = snap.data();
          regrasVagas.limiteTotalDia = parseInt(dados.limiteTotalDia, 10) || 35;
          regrasVagas.datasBloqueadas = Array.isArray(dados.datasBloqueadas) ? dados.datasBloqueadas : [];
          regrasVagas.exames = { ...catalogoPadrao, ...(dados.exames || {}) };
        }
      } catch (err) {
        console.error("Erro ao carregar regras:", err);
      }
      renderizarExames();
    }

    // Renderizar exames verificando se estão ativos e se estão esgotados no dia
    function renderizarExames() {
      // Calcular contagem de exames já agendados no dia selecionado
      const contagemExames = {};
      agendamentosDoDiaAtual.forEach(ag => {
        if (ag.exams) {
          Object.keys(ag.exams).forEach(cod => {
            contagemExames[cod] = (contagemExames[cod] || 0) + 1;
          });
        }
      });

      examsGrid.innerHTML = '';
      Object.keys(regrasVagas.exames).forEach(codigo => {
        const ex = regrasVagas.exames[codigo];
        if (!ex || !ex.ativo) return;

        const totalMarcados = contagemExames[codigo] || 0;
        const limite = parseInt(ex.limiteDia, 10) || 0;
        const esgotado = (limite > 0 && totalMarcados >= limite);

        const chip = document.createElement('div');
        chip.className = 'exam-chip' + (codigo === 'CLINICO' ? ' active' : '') + (esgotado ? ' esgotado' : '');
        chip.setAttribute('data-exam', codigo);

        if (esgotado) {
          chip.innerHTML = `${ex.nome} <span class="badge-esgotado">Esgotado</span>`;
          chip.title = `Vagas esgotadas para este exame na data selecionada (${totalMarcados}/${limite})`;
        } else {
          chip.textContent = ex.nome;
        }

        chip.addEventListener('click', () => {
          if (esgotado) {
            alert(`As vagas para o exame "${ex.nome}" já se esgotaram nesta data (${totalMarcados}/${limite}). Por favor, escolha outra data se esse exame for obrigatório.`);
            return;
          }
          if (codigo === 'CLINICO') return;
          chip.classList.toggle('active');
          if (codigo === 'PSICO') {
            alertBanner.style.display = chip.classList.contains('active') ? 'flex' : 'none';
          }
          atualizarHorario();
        });

        examsGrid.appendChild(chip);
      });
    }

    // Validação ao mudar de data
    dataInput.addEventListener('change', async (e) => {
      const dataSelecionada = e.target.value;
      if (!dataSelecionada) return;

      const [ano, mes, dia] = dataSelecionada.split('-').map(Number);
      const dataObj = new Date(ano, mes - 1, dia);
      const diaSemana = dataObj.getDay();

      // 1. Validar final de semana
      if (diaSemana === 0 || diaSemana === 6) {
        alert('A clínica Alpale atende apenas de segunda a sexta-feira.');
        e.target.value = '';
        dateInfoBadge.style.display = 'none';
        divMedico.style.display = 'none';
        divHorario.style.display = 'none';
        agendamentosDoDiaAtual = [];
        renderizarExames();
        return;
      }

      // 2. Validar feriados / datas bloqueadas configuradas no index.html
      if (regrasVagas.datasBloqueadas.includes(dataSelecionada)) {
        alert(`A data ${dataSelecionada.split('-').reverse().join('/')} está bloqueada para novos agendamentos (feriado ou sem atendimento na clínica). Por favor, selecione outra data.`);
        e.target.value = '';
        dateInfoBadge.style.display = 'none';
        divMedico.style.display = 'none';
        divHorario.style.display = 'none';
        agendamentosDoDiaAtual = [];
        renderizarExames();
        return;
      }

      // 3. Consultar no Firebase o total de agendamentos já marcados para esse dia
      dateInfoBadge.style.display = 'block';
      dateInfoBadge.style.color = 'var(--secondary)';
      dateInfoBadge.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Verificando vagas disponíveis...`;

      try {
        const q = query(collection(db, "agendamentos"), where("date", "==", dataSelecionada));
        const snap = await getDocs(q);
        agendamentosDoDiaAtual = [];
        snap.forEach(d => agendamentosDoDiaAtual.push(d.data()));

        const totalNoDia = agendamentosDoDiaAtual.length;
        const limiteGeral = regrasVagas.limiteTotalDia || 35;

        // Se atingiu o limite geral configurado no painel:
        if (totalNoDia >= limiteGeral) {
          alert(`Desculpe, as vagas para o dia ${dataSelecionada.split('-').reverse().join('/')} estão totalmente esgotadas (${totalNoDia}/${limiteGeral} agendamentos). Por favor, escolha outra data.`);
          e.target.value = '';
          dateInfoBadge.style.display = 'none';
          divMedico.style.display = 'none';
          divHorario.style.display = 'none';
          agendamentosDoDiaAtual = [];
          renderizarExames();
          return;
        }

        const vagasRestantes = limiteGeral - totalNoDia;
        dateInfoBadge.style.color = vagasRestantes <= 5 ? 'var(--warning)' : 'var(--success)';
        dateInfoBadge.innerHTML = `<i class="fa-solid fa-circle-check"></i> Data disponível: <strong>${vagasRestantes} vagas restantes</strong> para este dia.`;

        // Renderiza os exames considerando os limites específicos deste dia
        renderizarExames();

      } catch (err) {
        console.error("Erro ao verificar vagas:", err);
        dateInfoBadge.style.display = 'none';
      }

      // Preencher médicos da escala
      const medicosDoDia = escalaSemanal[diaSemana] || [];
      divMedico.style.display = 'flex';
      divHorario.style.display = 'flex';
      medicoSelect.innerHTML = '<option value="" disabled selected>Selecione um médico...</option>';

      medicosDoDia.forEach(medico => {
        const option = document.createElement('option');
        option.value = medico.nome;
        option.textContent = medico.nome;
        option.dataset.horario = medico.horarioInicio;
        medicoSelect.appendChild(option);
      });

      if (medicosDoDia.length > 0) {
        medicoSelect.selectedIndex = 1;
        atualizarHorario();
      }
    });

    medicoSelect.addEventListener('change', atualizarHorario);

    arquivoInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        fileNameSpan.textContent = e.target.files[0].name;
        filePreview.style.display = 'flex';
        uploadText.style.display = 'none';
        uploadArea.style.borderColor = 'var(--success)';
      }
    });

    function gerarPdfComprovante(dados) {
      if (!window.jspdf) return;
      const { jsPDF } = window.jspdf;

      docPdf.setFillColor(30, 58, 95);

      docPdf.setTextColor(255, 255, 255);
      docPdf.setFont("helvetica", "bold");
      docPdf.setFontSize(16);
      docPdf.text("ALPALE SAÚDE OCUPACIONAL", 15, 22);
      
      docPdf.setTextColor(44, 62, 80);
      docPdf.setFontSize(18);
      docPdf.text("Comprovante de Agendamento", 15, 50);
      
      docPdf.setFontSize(11);
      docPdf.setFont("helvetica", "normal");
      docPdf.text(`Emitido em: ${new Date().toLocaleDateString('pt-BR')} às ${new Date().toLocaleTimeString('pt-BR')}`, 15, 58);
      
      docPdf.setDrawColor(200, 200, 200);
      docPdf.line(15, 65, 195, 65);
      
      docPdf.setFont("helvetica", "bold");
      docPdf.text("Dados do Atendimento:", 15, 78);
      docPdf.setFont("helvetica", "normal");
      docPdf.text(`• Empresa: ${dados.empresa}`, 15, 88);
      docPdf.text(`• Colaborador: ${dados.funcionario}`, 15, 98);
      docPdf.text(`• Tipo de Exame (ASO): ${dados.tipo}`, 15, 108);
      docPdf.text(`• Médico Selecionado: ${dados.medico}`, 15, 118);
      docPdf.text(`• Data Marcada: ${dados.date.split('-').reverse().join('/')}`, 15, 128);
      docPdf.text(`• Horário de Chegada: ${dados.horario}`, 15, 138);

      docPdf.save(`Comprovante_Alpale_${dados.funcionario.replace(/\s+/g, '_')}.pdf`);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const dataEscolhida = dataInput.value;
      if (!dataEscolhida) {
        alert("Por favor, selecione uma data para o agendamento.");
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> PROCESSANDO...`;
      statusMsg.style.color = 'var(--primary)';
      statusMsg.textContent = 'Verificando vagas e registrando agendamento...';

      try {
        // Validação final de segurança no Firebase antes de salvar:
        if (regrasVagas.datasBloqueadas.includes(dataEscolhida)) {
          throw new Error("DATA_BLOQUEADA");
        }

        const qCheck = query(collection(db, "agendamentos"), where("date", "==", dataEscolhida));
        const snapCheck = await getDocs(qCheck);
        const docsNoDia = [];
        snapCheck.forEach(d => docsNoDia.push(d.data()));

        const limiteGeral = regrasVagas.limiteTotalDia || 35;
        if (docsNoDia.length >= limiteGeral) {
          throw new Error("VAGAS_ESGOTADAS");
        }

        const examesSelecionados = {};
        document.querySelectorAll('.exam-chip.active').forEach(chip => {
          examesSelecionados[chip.getAttribute('data-exam')] = true;
        });

        // Conferir se algum exame escolhido estourou a cota
        for (const cod of Object.keys(examesSelecionados)) {
          const cfgEx = regrasVagas.exames[cod];
          if (cfgEx && cfgEx.limiteDia > 0) {
            const qtdDesseExame = docsNoDia.filter(d => d.exams && d.exams[cod]).length;
            if (qtdDesseExame >= cfgEx.limiteDia) {
              throw new Error(`EXAME_ESGOTADO:${cfgEx.nome}`);
            }
          }
        }

        let urlArquivo = "";
        const arquivo = arquivoInput.files[0];
        const nomeColab = document.getElementById('funcionario').value.trim();

        if (arquivo) {
          const ext = arquivo.name.split('.').pop();
          const refArquivo = storageRef(storage, `kits/${Date.now()}_${nomeColab.replace(/\s+/g, '')}.${ext}`);
          await uploadBytes(refArquivo, arquivo);
          urlArquivo = await getDownloadURL(refArquivo);
        }

        const entryId = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

        const entryData = {
          id: entryId,
          date: dataEscolhida,
          horario: horarioInput.value,
          medico: medicoSelect.value,
          empresa: document.getElementById('empresa').value.trim(),
          tipo: document.getElementById('tipo').value,
          funcionario: nomeColab,
          exams: examesSelecionados,
          qtd: 1,
          kitUrl: urlArquivo,
          criadoEm: new Date().toISOString()
        };

        const promessaBanco = setDoc(doc(db, "agendamentos", entryId), entryData);
        const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error("TIMEOUT")), 15000));
        
        await Promise.race([promessaBanco, timeout]);

        gerarPdfComprovante(entryData);

        statusMsg.style.color = 'var(--success)';
        statusMsg.innerHTML = `<i class="fa-solid fa-circle-check"></i> Agendamento confirmado com sucesso!`;
        
        form.reset();
        dateInfoBadge.style.display = 'none';
        divMedico.style.display = 'none';
        divHorario.style.display = 'none';
        filePreview.style.display = 'none';
        uploadText.style.display = 'block';
        uploadArea.style.borderColor = 'var(--border-color)';
        alertBanner.style.display = 'none';
        
        // Recarregar contagens
        agendamentosDoDiaAtual = [];
        renderizarExames();

      } catch (err) {
        console.error(err);
        statusMsg.style.color = 'var(--danger)';
        if (err.message === "DATA_BLOQUEADA") {
          statusMsg.textContent = 'A data selecionada está bloqueada para agendamentos. Escolha outra data.';
        } else if (err.message === "VAGAS_ESGOTADAS") {
          statusMsg.textContent = 'Desculpe, as vagas para este dia acabaram de se esgotar. Por favor, escolha outra data.';
        } else if (err.message && err.message.startsWith("EXAME_ESGOTADO:")) {
          const nomeExame = err.message.split(":")[1];
          statusMsg.textContent = `As vagas para o exame "${nomeExame}" se esgotaram nesta data.`;
        } else if (err.message === "TIMEOUT") {
          statusMsg.textContent = 'A conexão demorou muito. Verifique a internet e tente novamente.';
        } else {
          statusMsg.textContent = 'Erro ao registrar agendamento. Tente novamente.';
        }
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = `CONFIRMAR AGENDAMENTO`;
      }
    });

    // Iniciar carregando as regras
    carregarRegrasVagas();
  </script>
