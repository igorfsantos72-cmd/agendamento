<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitar Agendamento - Alpale Saúde Ocupacional</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <style>
    :root {
      --primary: #1E3A5F;
      --secondary: #008CB4;
      --bg-light: #F4F7FA;
      --border-color: #CBD5E1;
      --white: #FFFFFF;
      --success: #2EC4B6;
      --danger: #EF4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background-color: var(--bg-light); color: var(--primary); display: flex; flex-direction: column; min-height: 100vh; }

    /* CABEÇALHO CENTRALIZADO COM LOGO MAIOR */
    header {
      background: var(--white);
      padding: 2rem 1rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border-bottom: 4px solid var(--secondary);
    }
    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 0.8rem;
    }
    .logo-img { height: 140px; width: auto; object-fit: contain; } /* Logo Bem Maior */
    .brand-section h1 { font-size: 1.6rem; font-weight: 700; color: var(--primary); margin-top: 10px; }
    .brand-section p { font-size: 0.95rem; color: #6C7A89; }

    main { flex: 1; padding: 2rem 1rem; display: flex; justify-content: center; align-items: center; }
    .form-card {
      background: var(--white);
      width: 100%;
      max-width: 760px;
      border-radius: 16px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.08);
      padding: 2.5rem;
    }
    .card-title { font-size: 1.75rem; font-weight: 700; color: var(--primary); margin-bottom: 0.5rem; text-align: center; }
    .card-subtitle { font-size: 0.9rem; color: #6C7A89; text-align: center; margin-bottom: 2.25rem; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.5rem; }
    
    @media (max-width: 640px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-card { padding: 1.5rem; }
      .logo-img { height: 110px; } 
    }

    .input-group { display: flex; flex-direction: column; }
    .input-group label { font-size: 0.85rem; font-weight: 600; color: var(--primary); margin-bottom: 0.5rem; }
    .input-wrapper { position: relative; }
    .input-wrapper i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #6C7A89; }
    .input-wrapper input, .input-wrapper select {
      width: 100%; padding: 0.8rem 1rem 0.8rem 2.6rem; border: 1.5px solid var(--border-color); border-radius: 10px; font-size: 0.9rem; background: var(--white);
    }
    .input-wrapper input:focus, .input-wrapper select:focus { border-color: var(--secondary); outline: none; box-shadow: 0 0 0 3px rgba(0, 140, 180, 0.15); }

    .exams-title { font-size: 0.9rem; font-weight: 700; color: var(--primary); margin-bottom: 0.85rem; }
    .exams-grid { display: flex; flex-wrap: wrap; gap: 0.65rem; margin-bottom: 1.5rem; }
    .exam-chip {
      background: var(--white); border: 1.5px solid var(--border-color); padding: 0.55rem 1.15rem; border-radius: 50px; font-size: 0.825rem; font-weight: 600; color: var(--primary); cursor: pointer; user-select: none; transition: all 0.25s ease;
    }
    .exam-chip:hover { border-color: var(--secondary); background: rgba(0, 140, 180, 0.04); }
    .exam-chip.active { background: var(--primary); border-color: var(--primary); color: var(--white); }

    .upload-area {
      border: 2px dashed var(--border-color); background: var(--bg-light); border-radius: 12px; padding: 1.75rem; text-align: center; cursor: pointer; position: relative; margin-bottom: 2rem;
    }
    .upload-area input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    .upload-icon { font-size: 2.2rem; color: var(--secondary); margin-bottom: 0.5rem; }
    .upload-text { font-size: 0.85rem; font-weight: 600; color: var(--primary); }
    .file-preview { display: none; align-items: center; justify-content: center; gap: 0.5rem; font-size: 0.85rem; color: var(--success); font-weight: 600; margin-top: 0.5rem; }

    .btn-submit {
      width: 100%; background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 100%); color: var(--white); border: none; padding: 1.1rem; border-radius: 50px; font-size: 1rem; font-weight: 600; cursor: pointer; box-shadow: 0 4px 18px rgba(30, 58, 95, 0.25); margin-top: 1rem;
    }
    .btn-submit:disabled { background: #CBD5E1; cursor: not-allowed; box-shadow: none; }
    .status-msg { text-align: center; margin-top: 1.25rem; font-size: 0.9rem; font-weight: 600; }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <img src="ALPALE LOGO-01.jpg" alt="Alpale Saúde Ocupacional" class="logo-img" onerror="this.src='logo.png'">
      <div class="brand-section">
        <h1>Solicitar Agendamento</h1>
        <p>Alpale Saúde Ocupacional</p>
      </div>
    </div>
  </header>

  <main>
    <div class="form-card">
      <h2 class="card-title">Agendar Exame Ocupacional</h2>
      <p class="card-subtitle">Preencha os dados e opcionalmente anexe a guia encaminhada pela empresa.</p>

      <form id="agendamentoForm">
        <div class="form-grid">
          <div class="input-group">
            <label for="empresa">Empresa Solicitante *</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-building"></i>
              <input type="text" id="empresa" placeholder="Nome da empresa" required>
            </div>
          </div>

          <div class="input-group">
            <label for="funcionario">Nome do Colaborador *</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-user"></i>
              <input type="text" id="funcionario" placeholder="Nome completo" required>
            </div>
          </div>

          <div class="input-group">
            <label for="cpf">CPF do Colaborador *</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-id-card"></i>
              <input type="text" id="cpf" placeholder="000.000.000-00" required>
            </div>
          </div>

          <div class="input-group">
            <label for="tipo">Tipo de Exame (ASO) *</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-notes-medical"></i>
              <select id="tipo" required>
                <option value="" disabled selected>Selecione o tipo do ASO...</option>
                <option value="Admissional">Admissional</option>
                <option value="Periódico">Periódico</option>
                <option value="Demissional">Demissional</option>
                <option value="Mudança de Função">Mudança de Função</option>
                <option value="Retorno">Retorno ao Trabalho</option>
              </select>
            </div>
          </div>

          <div class="input-group" style="grid-column: span 2;">
            <label for="data">Data Pretendida *</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-calendar-day"></i>
              <input type="date" id="data" required>
            </div>
          </div>

          <!-- NOVOS CAMPOS DINÂMICOS (Ficam ocultos até escolher a data) -->
          <div class="input-group" id="divMedico" style="display: none;">
            <label for="medico">Médico Disponível *</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-user-doctor"></i>
              <select id="medico" required>
                <option value="" disabled selected>Selecione a data primeiro...</option>
              </select>
            </div>
          </div>

          <div class="input-group" id="divHorario" style="display: none;">
            <label for="horario">Horários Livres *</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-clock"></i>
              <select id="horario" required>
                <option value="" disabled selected>Selecione o médico primeiro...</option>
              </select>
            </div>
          </div>
        </div>

        <h3 class="exams-title">Exames solicitados:</h3>
        <div class="exams-grid" id="examsGrid">
          <!-- Renderizado dinamicamente pelo banco (padrão só Clínico ativo) -->
        </div>

        <div class="input-group">
          <label>Anexar Guia / Kit de Atendimento (Opcional)</label>
          <div class="upload-area" id="uploadArea">
            <input type="file" id="arquivoKit" accept=".pdf, .png, .jpg, .jpeg">
            <div class="upload-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
            <div class="upload-text" id="uploadText">Clique ou arraste para anexar a Guia se houver (PDF, PNG, JPG)</div>
            <div class="file-preview" id="filePreview">
              <i class="fa-solid fa-circle-check"></i> <span id="fileName">arquivo.pdf</span>
            </div>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="btnSubmit">
          <i class="fa-solid fa-check"></i> CONFIRMAR AGENDAMENTO E GERAR COMPROVANTE
        </button>

        <div class="status-msg" id="statusMsg"></div>
      </form>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, getDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
    import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAL2xXqo83pWKhyCta4Nk0gockDstxtJY4",
      authDomain: "agendamento-alpale.firebaseapp.com",
      projectId: "agendamento-alpale",
      storageBucket: "agendamento-alpale.firebasestorage.app",
      messagingSenderId: "491340347533",
      appId: "1:491340347533:web:0983b4dba5bbdcc534cac4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // Variáveis da Interface
    const form = document.getElementById('agendamentoForm');
    const examsGrid = document.getElementById('examsGrid');
    const cpfInput = document.getElementById('cpf');
    const dataInput = document.getElementById('data');
    const medicoSelect = document.getElementById('medico');
    const horarioSelect = document.getElementById('horario');
    const divMedico = document.getElementById('divMedico');
    const divHorario = document.getElementById('divHorario');
    const arquivoInput = document.getElementById('arquivoKit');
    const uploadArea = document.getElementById('uploadArea');
    const uploadText = document.getElementById('uploadText');
    const filePreview = document.getElementById('filePreview');
    const fileNameSpan = document.getElementById('fileName');
    const btnSubmit = document.getElementById('btnSubmit');
    const statusMsg = document.getElementById('statusMsg');

    // MÁSCARA CPF
    cpfInput.addEventListener('input', (e) => {
      let v = e.target.value.replace(/\D/g, "");
      if (v.length <= 11) {
        v = v.replace(/(\d{3})(\d)/, "$1.$2");
        v = v.replace(/(\d{3})(\d)/, "$1.$2");
        v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
      }
      e.target.value = v;
    });

    // CARREGAR EXAMES LIBERADOS
    let regrasVagas = { exames: { CLINICO: { ativo: true, nome: "Clínico" } } };
    async function carregarExamesLiberados() {
      try {
        const snap = await getDoc(doc(db, "configuracoes", "limites_agendamento"));
        if (snap.exists() && snap.data().exames) regrasVagas.exames = snap.data().exames;
      } catch (err) {}
      examsGrid.innerHTML = '';
      Object.keys(regrasVagas.exames).forEach(codigo => {
        const ex = regrasVagas.exames[codigo];
        if (!ex || !ex.ativo) return;
        const chip = document.createElement('div');
        chip.className = 'exam-chip' + (codigo === 'CLINICO' ? ' active' : '');
        chip.setAttribute('data-exam', codigo);
        chip.textContent = ex.nome;
        chip.addEventListener('click', () => {
          if (codigo === 'CLINICO') return;
          chip.classList.toggle('active');
        });
        examsGrid.appendChild(chip);
      });
    }
    carregarExamesLiberados();

    // =========================================================================
    // LÓGICA DE MÉDICOS E HORÁRIOS
    // =========================================================================
    
    // Quando escolhe a Data: Busca médicos disponíveis no banco
    dataInput.addEventListener('change', async (e) => {
      const dataSelecionada = e.target.value;
      const diaSemana = new Date(dataSelecionada).getUTCDay();
      
      if (diaSemana === 0 || diaSemana === 6) {
        alert('A clínica atende apenas de segunda a sexta-feira.');
        e.target.value = '';
        divMedico.style.display = 'none';
        divHorario.style.display = 'none';
        return;
      }

      // Mostra o campo de médico carregando
      divMedico.style.display = 'flex';
      divHorario.style.display = 'none';
      medicoSelect.innerHTML = '<option value="" disabled selected>Buscando médicos no banco...</option>';

      try {
        /*
          ATENÇÃO: Aqui o sistema consulta a coleção onde você cadastra os médicos.
          Estou assumindo que a coleção chama "medicos". 
          Se o nome for diferente, eu preciso que você me avise para eu ajustar!
        */
        const snapshot = await getDocs(collection(db, "medicos"));
        medicoSelect.innerHTML = '<option value="" disabled selected>Selecione um médico...</option>';
        
        let encontrouMedicos = false;
        snapshot.forEach(docMedico => {
          const medicoData = docMedico.data();
          // Simula que achou um médico (Você precisará me confirmar como eles estão salvos)
          const option = document.createElement('option');
          option.value = medicoData.nome || docMedico.id;
          option.textContent = medicoData.nome || "Dr(a). " + docMedico.id;
          // Salva os horários do médico no elemento para usar depois
          option.dataset.horarios = JSON.stringify(medicoData.horarios || ["07:30", "08:00", "08:30", "09:00", "09:30", "10:00"]);
          medicoSelect.appendChild(option);
          encontrouMedicos = true;
        });

        if (!encontrouMedicos) {
          // Fallback caso você ainda não tenha a coleção "medicos" criada no Firebase
          medicoSelect.innerHTML = `
            <option value="" disabled selected>Selecione um médico...</option>
            <option value="Dr. Atendimento Padrão" data-horarios='["07:30", "08:00", "08:30", "09:00", "09:30", "10:00"]'>Dr. Atendimento Padrão</option>
          `;
        }
      } catch (err) {
        console.error("Erro ao buscar médicos:", err);
      }
    });

    // Quando escolhe o Médico: Busca os horários e remove os ocupados
    medicoSelect.addEventListener('change', async (e) => {
      divHorario.style.display = 'flex';
      horarioSelect.innerHTML = '<option value="" disabled selected>Calculando horários livres...</option>';
      
      const dataSelecionada = dataInput.value;
      const nomeMedico = e.target.value;
      const opcaoSelecionada = e.target.options[e.target.selectedIndex];
      const horariosDoMedico = JSON.parse(opcaoSelecionada.dataset.horarios || "[]");

      try {
        // Busca todos os agendamentos já marcados para essa data com esse médico
        const q = query(collection(db, "agendamentos"), 
          where("date", "==", dataSelecionada), 
          where("medico", "==", nomeMedico)
        );
        const agendamentosSnap = await getDocs(q);
        
        const horariosOcupados = [];
        agendamentosSnap.forEach(docAgendado => {
          horariosOcupados.push(docAgendado.data().horario);
        });

        // Filtra os horários removendo os que já estão ocupados
        horarioSelect.innerHTML = '<option value="" disabled selected>Selecione o horário...</option>';
        horariosDoMedico.forEach(horario => {
          const option = document.createElement('option');
          option.value = horario;
          
          if (horariosOcupados.includes(horario)) {
            option.textContent = `${horario} (Ocupado)`;
            option.disabled = true;
          } else {
            option.textContent = horario;
          }
          horarioSelect.appendChild(option);
        });

      } catch (err) {
        console.error("Erro ao verificar horários ocupados:", err);
      }
    });

    // =========================================================================

    // UPLOAD PREVIEW
    arquivoInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        fileNameSpan.textContent = e.target.files[0].name;
        filePreview.style.display = 'flex';
        uploadText.style.display = 'none';
        uploadArea.style.borderColor = 'var(--success)';
      }
    });

    // PDF COMPROVANTE
    function gerarPdfComprovante(dados) {
      if (!window.jspdf) return;
      const { jsPDF } = window.jspdf;
      const docPdf = new jsPDF();

      docPdf.setFillColor(30, 58, 95);
      docPdf.rect(0, 0, 210, 35, "F");
      docPdf.setTextColor(255, 255, 255);
      docPdf.setFont("helvetica", "bold");
      docPdf.setFontSize(16);
      docPdf.text("ALPALE SAÚDE OCUPACIONAL", 15, 22);

      docPdf.setTextColor(44, 62, 80);
      docPdf.setFontSize(18);
      docPdf.text("Comprovante de Agendamento", 15, 50);

      docPdf.setFontSize(11);
      docPdf.setFont("helvetica", "normal");
      docPdf.text(`Emitido em: ${new Date().toLocaleDateString('pt-BR')} às ${new Date().toLocaleTimeString('pt-BR')}`, 15, 58);
      docPdf.setDrawColor(200, 200, 200);
      docPdf.line(15, 65, 195, 65);

      docPdf.setFont("helvetica", "bold");
      docPdf.text("Dados do Atendimento:", 15, 78);
      docPdf.setFont("helvetica", "normal");
      docPdf.text(`• Empresa: ${dados.empresa}`, 15, 88);
      docPdf.text(`• Colaborador: ${dados.funcionario}`, 15, 98);
      docPdf.text(`• CPF: ${dados.cpf}`, 15, 108);
      docPdf.text(`• Médico Selecionado: ${dados.medico}`, 15, 118);
      docPdf.text(`• Data: ${dados.date.split('-').reverse().join('/')} às ${dados.horario}`, 15, 128);

      const listaExamesStr = Object.keys(dados.exams).join(", ");
      docPdf.text(`• Exames: ${listaExamesStr}`, 15, 138);

      docPdf.setFillColor(240, 244, 248);
      docPdf.roundedRect(15, 155, 180, 30, 3, 3, "F");
      docPdf.setFont("helvetica", "bold");
      docPdf.setTextColor(30, 58, 95);
      docPdf.text("Instruções Importantes:", 20, 165);
      docPdf.setFont("helvetica", "normal");
      docPdf.setFontSize(10);
      docPdf.text("Por favor, compareça à clínica Alpale com documento de identidade com foto", 20, 173);
      docPdf.text("e guia de encaminhamento (quando aplicável) com 10 minutos de antecedência.", 20, 180);

      docPdf.save(`Comprovante_Alpale_${dados.cpf.replace(/\D/g, '')}.pdf`);
    }

    // ENVIO FINAL
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      btnSubmit.disabled = true;
      btnSubmit.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> PROCESSANDO AGENDAMENTO...`;
      statusMsg.style.color = 'var(--primary)';
      statusMsg.textContent = 'A registar agendamento e a gerar comprovativo...';

      try {
        let urlArquivo = "";
        const arquivo = arquivoInput.files[0];
        const cpfVal = cpfInput.value;

        if (arquivo) {
          const ext = arquivo.name.split('.').pop();
          const refArquivo = storageRef(storage, `kits/${Date.now()}_${cpfVal.replace(/\D/g, '')}.${ext}`);
          await uploadBytes(refArquivo, arquivo);
          urlArquivo = await getDownloadURL(refArquivo);
        }

        const examesSelecionados = {};
        document.querySelectorAll('.exam-chip.active').forEach(chip => {
          examesSelecionados[chip.getAttribute('data-exam')] = true;
        });

        const entryId = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

        const entryData = {
          id: entryId,
          date: dataInput.value,
          horario: horarioSelect.value, // Pega o horário escolhido
          medico: medicoSelect.value,   // Pega o médico escolhido
          empresa: document.getElementById('empresa').value.trim(),
          tipo: document.getElementById('tipo').value,
          funcionario: document.getElementById('funcionario').value.trim(),
          cpf: cpfVal,
          exams: examesSelecionados,
          qtd: 1,
          kitUrl: urlArquivo,
          criadoEm: new Date().toISOString()
        };

        const promessaBanco = setDoc(doc(db, "agendamentos", entryId), entryData);
        const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error("TIMEOUT")), 15000));
        
        await Promise.race([promessaBanco, timeout]);

        gerarPdfComprovante(entryData);

        statusMsg.style.color = 'var(--success)';
        statusMsg.innerHTML = `<i class="fa-solid fa-circle-check"></i> Agendamento confirmado com sucesso!`;
        
        form.reset();
        divMedico.style.display = 'none';
        divHorario.style.display = 'none';
        filePreview.style.display = 'none';
        uploadText.style.display = 'block';
        uploadArea.style.borderColor = 'var(--border-color)';
        carregarExamesLiberados();

      } catch (err) {
        console.error(err);
        statusMsg.style.color = 'var(--danger)';
        if (err.message === "TIMEOUT") {
          statusMsg.textContent = 'Demorou muito tempo a ligar. Verifique a internet e tente novamente.';
        } else {
          statusMsg.textContent = 'Erro ao registar agendamento. Tente novamente.';
        }
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = `<i class="fa-solid fa-check"></i> CONFIRMAR AGENDAMENTO E GERAR COMPROVANTE`;
      }
    });
  </script>
</body>
</html>
