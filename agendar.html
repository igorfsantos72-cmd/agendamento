<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitar Agendamento - Alpale Saúde Ocupacional</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Biblioteca para gerar o PDF na hora -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <style>
    :root {
      --primary: #1E3A5F;
      --secondary: #008CB4;
      --bg-light: #F4F7FA;
      --border-color: #CBD5E1;
      --white: #FFFFFF;
      --success: #2EC4B6;
      --danger: #EF4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background-color: var(--bg-light); color: var(--primary); display: flex; flex-direction: column; min-height: 100vh; }

    header {
      background: var(--white);
      padding: 1.5rem 2rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border-bottom: 4px solid var(--secondary);
    }
    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .brand-section h1 { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
    .brand-section p { font-size: 0.9rem; color: #6C7A89; }
    
    /* Logo ampliada */
    .logo-img { height: 90px; width: auto; object-fit: contain; }

    main { flex: 1; padding: 2rem 1rem; display: flex; justify-content: center; align-items: center; }
    .form-card {
      background: var(--white);
      width: 100%;
      max-width: 760px;
      border-radius: 16px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.08);
      padding: 2.5rem;
    }
    .card-title { font-size: 1.75rem; font-weight: 700; color: var(--primary); margin-bottom: 0.5rem; text-align: center; }
    .card-subtitle { font-size: 0.9rem; color: #6C7A89; text-align: center; margin-bottom: 2.25rem; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.5rem; }
    
    @media (max-width: 640px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-card { padding: 1.5rem; }
      .logo-img { height: 80px; } /* Mantém a logo grande no celular */
      .header-container { justify-content: center; text-align: center; }
    }

    .input-group { display: flex; flex-direction: column; }
    .input-group label { font-size: 0.85rem; font-weight: 600; color: var(--primary); margin-bottom: 0.5rem; }
    .input-wrapper { position: relative; }
    .input-wrapper i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #6C7A89; }
