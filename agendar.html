<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitar Agendamento - Alpale Saúde Ocupacional</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #1E3A5F;        /* Azul Escuro da Cruz do Logo */
      --secondary: #008CB4;      /* Azul de Destaque da Faixa/Saúde */
      --accent-cyan: #00B4D8;
      --dark-gray: #555555;
      --light-gray: #6C7A89;     
      --bg-light: #F4F7FA;
      --border-color: #CBD5E1;
      --white: #FFFFFF;
      --success: #2EC4B6;
      --danger: #EF4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: var(--bg-light);
      color: var(--primary);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Cabeçalho */
    header {
      background: var(--white);
      padding: 1.25rem 2rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border-bottom: 4px solid var(--secondary);
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand-section h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.5px;
    }

    .brand-section p {
      font-size: 0.85rem;
      color: var(--light-gray);
    }

    .logo-img {
      height: 55px;
      width: auto;
      object-fit: contain;
    }

    /* Card Principal */
    main {
      flex: 1;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .form-card {
      background: var(--white);
      width: 100%;
      max-width: 760px;
      border-radius: 16px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.08);
      padding: 2.5rem;
      position: relative;
    }

    .card-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .card-subtitle {
      font-size: 0.9rem;
      color: var(--light-gray);
      text-align: center;
      margin-bottom: 2.25rem;
    }

    /* Grid do Formulário */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      margin-bottom: 1.5rem;
    }

    @media (max-width: 640px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-card { padding: 1.5rem; }
      .header-container { justify-content: center; text-align: center; }
      .full-width-mobile { grid-column: span 1 !important; }
    }

    .input-group {
      display: flex;
      flex-direction: column;
    }

    .input-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--light-gray);
      font-size: 0.95rem;
    }

    .input-wrapper input,
    .input-wrapper select {
      width: 100%;
      padding: 0.8rem 1rem 0.8rem 2.6rem;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      font-size: 0.9rem;
      color: #333;
      background-color: var(--white);
      transition: all 0.3s ease;
    }

    .input-wrapper input:focus,
    .input-wrapper select:focus {
      border-color: var(--secondary);
      outline: none;
      box-shadow: 0 0 0 3px rgba(0, 140, 180, 0.15);
    }

    /* Exames (Chips) */
    .exams-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.85rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .exams-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--primary);
    }

    .vagas-badge {
      font-size: 0.78rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      background: #E0F2FE;
      color: #0369A1;
      display: none;
    }

    .exams-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      margin-bottom: 1.5rem;
    }

    .exam-chip {
      background: var(--white);
      border: 1.5px solid var(--border-color);
      padding: 0.55rem 1.15rem;
      border-radius: 50px;
      font-size: 0.825rem;
      font-weight: 600;
      color: var(--primary);
      cursor: pointer;
      user-select: none;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .exam-chip:hover {
      border-color: var(--secondary);
      background-color: rgba(0, 140, 180, 0.04);
    }

    .exam-chip.active {
      background-color: var(--primary);
      border-color: var(--primary);
      color: var(--white);
    }

    .exam-chip.esgotado {
      opacity: 0.45;
      pointer-events: none;
      background-color: #F1F5F9;
      border-color: #CBD5E1;
      color: #64748B;
      text-decoration: line-through;
    }

    .exam-chip[data-exam="CLINICO"] {
      cursor: default;
    }

      background
